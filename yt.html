    body {

    .browser-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .tab-bar {
        background: #0d1d35;
        display: flex;
        align-items: center;
        padding: 8px 8px 0 8px;
        border-bottom: 2px solid #1a2f4d;
        position: relative;
    }

    .tabs {
        display: flex;
        gap: 4px;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: thin;
    }

    .tabs::-webkit-scrollbar {
        height: 4px;
    }

    .tabs::-webkit-scrollbar-track {
        background: #0e1224;
    }

    .tabs::-webkit-scrollbar-thumb {
        background: #1a2f4d;
        border-radius: 2px;
    }

    .tab {
        background: #1a2f4d;
        color: #faf6de;
        border: none;
        padding: 10px 30px 10px 16px;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        white-space: nowrap;
        position: relative;
        min-width: 150px;
        max-width: 200px;
        transition: background 0.2s;
    }

    .tab:hover {
        background: #243d5c;
    }

    .tab.active {
        background: #0e1224;
    }

    .tab-close {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #faf6de;
        cursor: pointer;
        font-size: 18px;
        width: 20px;
        height: 20px;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 3px;
    }

    .tab-close:hover {
        background: rgba(250, 246, 222, 0.2);
    }

    .tab.closeable .tab-close {
        display: flex;
    }

    .new-tab-btn {
        background: #1a2f4d;
        border: none;
        color: #faf6de;
        width: 32px;
        height: 32px;

        align-items: center;
        justify-content: center;

    }

    .new-tab-btn:hover {
        background: #243d5c;

<!-- Settings Modal -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-content">
        <button class="settings-close" id="settingsClose">×</button>
        <h2>Settings</h2>
        <!-- EDITABLE: Add your settings content below -->
        <div class="settings-body">
            <!-- Add your custom settings content here -->
        </div>
    </div>
</div>

<script>
    // EDITABLE: Configure default URLs here
    const DEFAULT_URL_1 = 'https://example.com';
    const DEFAULT_URL_2 = 'https://apple.com';
    const MAX_TABS = 5;

    let tabs = [];
    let activeTabId = null;
    let tabCounter = 0;

    const tabsContainer = document.getElementById('tabs');
    const contentArea = document.getElementById('contentArea');
    const newTabBtn = document.getElementById('newTabBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsClose = document.getElementById('settingsClose');

    function createTab(type, url = null, closeable = false) {
        if (tabs.length >= MAX_TABS) {
            alert(`Maximum ${MAX_TABS} tabs allowed`);
            return;
        }

        const tabId = `tab-${tabCounter++}`;
        const tab = {
            id: tabId,
            type: type,
            url: url,
            closeable: closeable,
            videoUrl: null
        };

        tabs.push(tab);
        renderTab(tab);
        renderContent(tab);
        switchTab(tabId);
    }

    function renderTab(tab) {
        const tabElement = document.createElement('button');
        tabElement.className = `tab ${tab.closeable ? 'closeable' : ''}`;
        tabElement.id = `tab-btn-${tab.id}`;
        
        let tabTitle = '';
        if (tab.type === 'url1') tabTitle = 'Tab 1';
        else if (tab.type === 'url2') tabTitle = 'Tab 2';
        else if (tab.type === 'video') tabTitle = 'Video Player';

        tabElement.innerHTML = `
            ${tabTitle}
            ${tab.closeable ? '<span class="tab-close">×</span>' : ''}
        `;

        tabElement.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
                closeTab(tab.id);
            } else {
                switchTab(tab.id);
            }
        });

        tabsContainer.appendChild(tabElement);
    }

    function renderContent(tab) {
        const contentDiv = document.createElement('div');
        contentDiv.className = 'tab-content';
        contentDiv.id = `content-${tab.id}`;

        if (tab.type === 'url1' || tab.type === 'url2') {
            const iframe = document.createElement('iframe');
            iframe.src = tab.url;
            iframe.allow = 'fullscreen';
            iframe.sandbox = 'allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation';
            contentDiv.appendChild(iframe);
        } else if (tab.type === 'video') {
            contentDiv.innerHTML = `
                <div class="video-page">
                    <div class="video-input-container" id="input-${tab.id}">
                        <h2>Enter Video URL</h2>
                        <div class="input-group">
                            <input type="text" placeholder="redirector.googlevideo.com/videoplayback?..." id="video-input-${tab.id}">
                            <button id="load-video-${tab.id}">Next</button>
                        </div>
                    </div>
                    <div class="video-player-container" id="player-${tab.id}">
                        <div class="video-wrapper">
                            <video id="video-element-${tab.id}" controls controlsList="nodownload"></video>
                        </div>
                        <div class="video-controls">
                            <div class="progress-container">
                                <div class="time-display" id="time-${tab.id}">0:00 / 0:00</div>
                                <div class="progress-bar" id="progress-${tab.id}">
                                    <div class="progress-filled" id="progress-filled-${tab.id}"></div>
                                </div>
                            </div>
                            <div class="control-buttons">
                                <button class="control-btn" id="back-${tab.id}" title="Back 10s">⏪</button>
                                <button class="control-btn play-pause" id="play-pause-${tab.id}">▶</button>
                                <button class="control-btn" id="forward-${tab.id}" title="Forward 10s">⏩</button>
                                <button class="control-btn" id="fullscreen-${tab.id}" title="Fullscreen">⛶</button>
                                <div class="volume-container">
                                    <span>🔊</span>
                                    <input type="range" class="volume-slider" id="volume-${tab.id}" min="0" max="100" value="100">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            contentArea.appendChild(contentDiv);

            // Setup video player functionality
            setTimeout(() => setupVideoPlayer(tab.id), 0);
            return;
        }

        contentArea.appendChild(contentDiv);
    }

    function setupVideoPlayer(tabId) {
        const input = document.getElementById(`video-input-${tabId}`);
        const loadBtn = document.getElementById(`load-video-${tabId}`);
        const inputContainer = document.getElementById(`input-${tabId}`);
        const playerContainer = document.getElementById(`player-${tabId}`);
        const video = document.getElementById(`video-element-${tabId}`);
        const playPauseBtn = document.getElementById(`play-pause-${tabId}`);
        const backBtn = document.getElementById(`back-${tabId}`);
        const forwardBtn = document.getElementById(`forward-${tabId}`);
        const fullscreenBtn = document.getElementById(`fullscreen-${tabId}`);
        const volumeSlider = document.getElementById(`volume-${tabId}`);
        const progressBar = document.getElementById(`progress-${tabId}`);
        const progressFilled = document.getElementById(`progress-filled-${tabId}`);
        const timeDisplay = document.getElementById(`time-${tabId}`);

        const tab = tabs.find(t => t.id === tabId);

        function loadVideo() {
            let videoUrl = input.value.trim();
            if (!videoUrl) return;

            // Add https:// if not present
            if (!videoUrl.startsWith('http://') && !videoUrl.startsWith('https://')) {
                videoUrl = 'https://' + videoUrl;
            }

            video.src = videoUrl;
            video.load();
            tab.videoUrl = videoUrl;
            inputContainer.style.display = 'none';
            playerContainer.classList.add('active');
            
            video.addEventListener('loadedmetadata', () => {
                console.log('Video loaded successfully');
            });
            
            video.addEventListener('error', (e) => {
                console.error('Video error:', e);
                alert('Error loading video. Please check the URL and try again.');
            });
        }

        loadBtn.addEventListener('click', loadVideo);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadVideo();
        });

        // If video URL already exists, load it
        if (tab.videoUrl) {
            input.value = tab.videoUrl;
            loadVideo();
        }

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '⏸';
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        backBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - 10);
        });

        forwardBtn.addEventListener('click', () => {
            video.currentTime = Math.min(video.duration, video.currentTime + 10);
        });

        fullscreenBtn.addEventListener('click', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            } else if (video.mozRequestFullScreen) {
                video.mozRequestFullScreen();
            } else if (video.msRequestFullscreen) {
                video.msRequestFullscreen();
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value / 100;
        });

        video.addEventListener('timeupdate', () => {
            if (video.duration && !isNaN(video.duration)) {
                const percent = (video.currentTime / video.duration) * 100;
                progressFilled.style.width = `${percent}%`;
                
                const currentMin = Math.floor(video.currentTime / 60);
                const currentSec = Math.floor(video.currentTime % 60);
                const durationMin = Math.floor(video.duration / 60);
                const durationSec = Math.floor(video.duration % 60);
                
                timeDisplay.textContent = `${currentMin}:${currentSec.toString().padStart(2, '0')} / ${durationMin}:${durationSec.toString().padStart(2, '0')}`;
            }
        });

        video.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
        });

        video.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });

        progressBar.addEventListener('click', (e) => {
            if (video.duration && !isNaN(video.duration)) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                video.currentTime = percent * video.duration;
            }
        });
    }

    function switchTab(tabId) {
        // Update active tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        const tabBtn = document.getElementById(`tab-btn-${tabId}`);
        const content = document.getElementById(`content-${tabId}`);

        if (tabBtn) tabBtn.classList.add('active');
        if (content) content.classList.add('active');

        activeTabId = tabId;
    }

    function closeTab(tabId) {
        const tabIndex = tabs.findIndex(t => t.id === tabId);
        if (tabIndex === -1 || !tabs[tabIndex].closeable) return;

        // Remove tab
        tabs.splice(tabIndex, 1);
        document.getElementById(`tab-btn-${tabId}`).remove();
        document.getElementById(`content-${tabId}`).remove();

        // Switch to another tab
        if (activeTabId === tabId && tabs.length > 0) {
            switchTab(tabs[0].id);
        }
    }

    // Initialize default tabs
    createTab('url1', DEFAULT_URL_1, false);
    createTab('url2', DEFAULT_URL_2, false);
    createTab('video', null, false);

    // New tab button - creates a tab with DEFAULT_URL_1
    newTabBtn.addEventListener('click', () => {
        createTab('url1', DEFAULT_URL_1, true);
    });

    // Settings modal
    settingsBtn.addEventListener('click', () => {
        settingsModal.classList.add('active');
    });

    settingsClose.addEventListener('click', () => {
        settingsModal.classList.remove('active');
    });

    settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) {
            settingsModal.classList.remove('active');
        }
    });
</script>
