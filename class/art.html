<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART NOTES</title>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0E0B07;
            --surface-paper: #1A140C;
            --text-ink: #F1E7CF;
            --text-muted: #8A7B5E;
            --border-rule: #3A2F1B;
            --accent: #D4AF37;
            --error-ink: #8B2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: var(--bg-primary);
            color: var(--text-ink);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            border: 4px solid var(--border-rule);
            padding: 25px;
            margin-bottom: 20px;
            background: var(--surface-paper);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .image-container {
            border: 4px solid var(--border-rule);
            padding: 15px;
            background: #000;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            position: relative;
        }

        .image-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            border: 1px solid var(--border-rule);
            display: block;
            transition: opacity 0.5s ease-in-out;
        }

        .error-message {
            color: var(--error-ink);
            text-align: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .loading {
            color: var(--accent);
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: archivalPulse 2s infinite ease-in-out;
        }

        @keyframes archivalPulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.98); }
        }

        ::selection {
            background: var(--accent);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>[ ART NOTES ]</h1>
        </header>

        <div class="image-container">
            <div class="image-wrapper" id="image-wrapper">
                <div class="loading">Inking Document...</div>
            </div>
        </div>
    </div>

    <script>
        function loadImage() {
            const imageWrapper = document.getElementById('image-wrapper');
            
            const img = new Image();
            const imagePath = 'art.jpg';
            
            img.onload = function() {
                imageWrapper.innerHTML = '';
                img.style.opacity = 0;
                imageWrapper.appendChild(img);
                // Smooth fade-in
                setTimeout(() => img.style.opacity = 1, 50);
            };
            
            img.onerror = function() {
                imageWrapper.innerHTML = `
                    <div class="error-message">
                        [ Extraction Failed ]<br>
                        Source Missing: ${imagePath}
                    </div>`;
            };
            
            img.src = imagePath;
            img.alt = 'Archival Specimen';
        }

        // Initialize display
        loadImage();
    </script>
</body>
</html>
