<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #2596be;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            border: 2px solid #2596be;
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(37, 150, 190, 0.05);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
            text-align: center;
        }

        h1 {
            color: #4db8e8;
            text-shadow: 0 0 10px #2596be;
            font-size: 2em;
        }

        .image-container {
            border: 2px solid #2596be;
            padding: 20px;
            background: rgba(37, 150, 190, 0.02);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        .image-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #2596be;
            box-shadow: 0 0 30px rgba(37, 150, 190, 0.5);
            display: block;
        }

        .error-message {
            color: #be2525;
            text-align: center;
            font-size: 1.2em;
            text-shadow: 0 0 10px #be2525;
        }

        .loading {
            color: #4db8e8;
            text-align: center;
            font-size: 1.2em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        ::selection {
            background: #2596be;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>[ ART NOTE ]</h1>
        </header>

        <div class="image-container">
            <div class="image-wrapper" id="image-wrapper">
                <div class="loading">[ LOADING IMAGE... ]</div>
            </div>
        </div>
    </div>

    <script>
        function loadImage() {
            const imageWrapper = document.getElementById('image-wrapper');
            
            // Create image element
            const img = new Image();
            const imagePath = 'art.jpg';
            
            img.onload = function() {
                imageWrapper.innerHTML = '';
                imageWrapper.appendChild(img);
            };
            
            img.onerror = function() {
                imageWrapper.innerHTML = '<div class="error-message">[ IMAGE NOT FOUND ]<br>ma/m1.jpg</div>';
            };
            
            img.src = imagePath;
            img.alt = 'Display Image';
        }

        // Initialize
        loadImage();
    </script>
</body>
</html>
