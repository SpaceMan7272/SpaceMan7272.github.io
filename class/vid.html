<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Which is the Strongest - Carson, Paayas, Hudson</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    #videoContainer {
      position: relative;
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #fsBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <video id="myVideo" src="billycongress.mp4" controls></video>
    <button id="fsBtn">Enter Fullscreen</button>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const btn = document.getElementById('fsBtn');

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        video.requestFullscreen().catch(err => console.error(err));
        btn.textContent = 'Exit Fullscreen';
      } else {
        document.exitFullscreen();
        btn.textContent = 'Enter Fullscreen';
      }
    }

    btn.addEventListener('click', toggleFullScreen);
    // Update button text when user exits fullscreen via ESC or browser UI
    document.addEventListener('fullscreenchange', () => {
      btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';
    });
  </script>
</body>
</html>
