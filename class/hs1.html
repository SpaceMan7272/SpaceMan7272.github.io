<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #2596be;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            border: 2px solid #2596be;
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(37, 150, 190, 0.05);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
        }

        h1 {
            color: #4db8e8;
            text-shadow: 0 0 10px #2596be;
            font-size: 2em;
            margin-bottom: 15px;
            text-align: center;
        }

        .download-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .download-card {
            background: rgba(37, 150, 190, 0.05);
            border: 2px solid #2596be;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 250px;
            max-width: 500px;
        }

        .download-card:hover {
            background: #2596be;
            color: #000;
            box-shadow: 0 0 15px #2596be;
            transform: translateY(-2px);
        }

        .download-card:hover .card-title,
        .download-card:hover .card-description {
            color: #000;
        }

        .card-title {
            color: #4db8e8;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 0 0 5px #2596be;
            margin-bottom: 8px;
        }

        .card-description {
            color: #2596be;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .pdf-container {
            border: 2px solid #2596be;
            background: rgba(37, 150, 190, 0.02);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
            height: calc(100vh - 240px);
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-message {
            color: #be2525;
            text-align: center;
            font-size: 1.2em;
            text-shadow: 0 0 10px #be2525;
            padding: 20px;
        }

        .loading {
            color: #4db8e8;
            text-align: center;
            font-size: 1.2em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        ::selection {
            background: #2596be;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>[ HEALTH SCIENCE I NOTE ]</h1>
            <div class="download-options">
                <div class="download-card" id="pdf-download">
                    <div class="card-title">PDF</div>
                    <div class="card-description">This PDF - full information, maybe not printable</div>
                </div>
                <div class="download-card" id="gdoc-download">
                    <div class="card-title">GOOGLE DOC</div>
                    <div class="card-description">Half info, printable, you can make a copy and edit it</div>
                </div>
            </div>
        </header>

        <div class="pdf-container" id="pdf-container">
            <div class="loading">[ LOADING PDF... ]</div>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        const PDF_PATH = 'hs.pdf';
        const GOOGLE_DOC_URL = 'https://docs.google.com/document/d/1nHDeYgqeO5vyg30tFM1kWlbzAaescBaBCIIFVji4ojQ/edit?usp=sharing'; // <-- ADD YOUR GOOGLE DOC URL HERE
        // =======================================

        // Load PDF
        function loadPDF() {
            const container = document.getElementById('pdf-container');
            
            const iframe = document.createElement('iframe');
            iframe.src = PDF_PATH;
            iframe.title = 'PDF Viewer';
            
            iframe.onload = function() {
                container.innerHTML = '';
                container.appendChild(iframe);
            };
            
            iframe.onerror = function() {
                container.innerHTML = '<div class="error-message">[ PDF NOT FOUND ]<br>' + PDF_PATH + '</div>';
            };
        }

        // PDF Download
        document.getElementById('pdf-download').addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = PDF_PATH;
            a.download = 'health_science_study_guide.pdf';
            a.click();
        });

        // Google Doc Link
        document.getElementById('gdoc-download').addEventListener('click', () => {
            if (GOOGLE_DOC_URL === 'YOUR_GOOGLE_DOC_URL_HERE') {
                alert('[ ERROR ] Google Doc URL not configured yet');
            } else {
                window.open(GOOGLE_DOC_URL, '_blank');
            }
        });

        // Initialize
        loadPDF();
    </script>
</body>
</html>
