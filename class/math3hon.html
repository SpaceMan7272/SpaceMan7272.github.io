<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3H Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0E0B07;
            --surface-paper: #1A140C;
            --text-ink: #F1E7CF;
            --text-muted: #8A7B5E;
            --border-rule: #3A2F1B;
            --accent: #D4AF37;
            --error: #8B2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Red Hat Display', sans-serif;
            background: var(--bg-primary);
            color: var(--text-ink);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            border: 4px solid var(--border-rule);
            padding: 30px;
            margin-bottom: 20px;
            background: var(--surface-paper);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-rule);
            color: var(--text-ink);
            padding: 10px 25px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            flex: 1;
            max-width: 150px;
        }

        .nav-btn:hover {
            background: var(--border-rule);
            color: var(--accent);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .unit-indicator {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            flex: 1;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .image-container {
            border: 4px solid var(--border-rule);
            padding: 10px;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            position: relative;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            border: 1px solid var(--border-rule);
            display: block;
            transition: opacity 0.3s ease;
        }

        .error-message {
            color: var(--error);
            text-align: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading {
            color: var(--accent);
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        ::selection {
            background: var(--accent);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>M3H Notes</h1>
            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn">Prev</button>
                <div class="unit-indicator" id="unit-display">Loading Catalog...</div>
                <button class="nav-btn" id="next-btn">Next</button>
            </div>
        </header>

        <div class="image-container">
            <div class="image-wrapper" id="image-wrapper">
                <div class="loading">Retrieving Document...</div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 1;
        const totalUnits = 10; // Updated to 10 units

        function updateDisplay() {
            const unitDisplay = document.getElementById('unit-display');
            const imageWrapper = document.getElementById('image-wrapper');
            
            unitDisplay.textContent = `UNIT ${currentUnit} // ${totalUnits}`;
            
            imageWrapper.innerHTML = '<div class="loading">Retrieving Document...</div>';
            
            const img = new Image();
            // Path logic remains the same: ma/m1.jpg through ma/m10.jpg
            const imagePath = `ma/m${currentUnit}.jpg`;
            
            img.onload = function() {
                imageWrapper.innerHTML = '';
                imageWrapper.appendChild(img);
                img.style.opacity = 0;
                setTimeout(() => img.style.opacity = 1, 50);
            };
            
            img.onerror = function() {
                imageWrapper.innerHTML = `
                    <div class="error-message">
                        [ Extraction Failed ]<br>
                        Reference: ${imagePath}
                    </div>`;
            };
            
            img.src = imagePath;
            img.alt = `Archival Note Unit ${currentUnit}`;
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentUnit = currentUnit <= 1 ? totalUnits : currentUnit - 1;
            updateDisplay();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentUnit = currentUnit >= totalUnits ? 1 : currentUnit + 1;
            updateDisplay();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
            if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
        });

        updateDisplay();
    </script>
</body>
</html>
