<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Image Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #2596be;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            border: 2px solid #2596be;
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(37, 150, 190, 0.05);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
        }

        h1 {
            color: #4db8e8;
            text-shadow: 0 0 10px #2596be;
            font-size: 2em;
            margin-bottom: 10px;
            text-align: center;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .nav-btn {
            background: #000;
            border: 2px solid #2596be;
            color: #2596be;
            padding: 15px 40px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
            max-width: 200px;
        }

        .nav-btn:hover {
            background: #2596be;
            color: #000;
            box-shadow: 0 0 15px #2596be;
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .unit-indicator {
            color: #4db8e8;
            font-size: 1.5em;
            text-shadow: 0 0 10px #2596be;
            text-align: center;
            flex: 1;
        }

        .image-container {
            border: 2px solid #2596be;
            padding: 20px;
            background: rgba(37, 150, 190, 0.02);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        .image-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #2596be;
            box-shadow: 0 0 30px rgba(37, 150, 190, 0.5);
            display: block;
        }

        .error-message {
            color: #be2525;
            text-align: center;
            font-size: 1.2em;
            text-shadow: 0 0 10px #be2525;
        }

        .loading {
            color: #4db8e8;
            text-align: center;
            font-size: 1.2em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        ::selection {
            background: #2596be;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>[ MATH 3 NOTES VIEWER ]</h1>
            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn">◄ PREV</button>
                <div class="unit-indicator" id="unit-display">UNIT 1 / 9</div>
                <button class="nav-btn" id="next-btn">NEXT ►</button>
            </div>
        </header>

        <div class="image-container">
            <div class="image-wrapper" id="image-wrapper">
                <div class="loading">[ LOADING IMAGE... ]</div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 1;
        const totalUnits = 9;

        function updateDisplay() {
            const unitDisplay = document.getElementById('unit-display');
            const imageWrapper = document.getElementById('image-wrapper');
            
            unitDisplay.textContent = `UNIT ${currentUnit} / ${totalUnits}`;
            
            // Show loading
            imageWrapper.innerHTML = '<div class="loading">[ LOADING IMAGE... ]</div>';
            
            // Create image element
            const img = new Image();
            const imagePath = `ma/m${currentUnit}.jpg`;
            
            img.onload = function() {
                imageWrapper.innerHTML = '';
                imageWrapper.appendChild(img);
            };
            
            img.onerror = function() {
                imageWrapper.innerHTML = '<div class="error-message">[ IMAGE NOT FOUND ]<br>ma/m' + currentUnit + '.jpg</div>';
            };
            
            img.src = imagePath;
            img.alt = `Unit ${currentUnit}`;
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentUnit--;
            if (currentUnit < 1) {
                currentUnit = totalUnits;
            }
            updateDisplay();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentUnit++;
            if (currentUnit > totalUnits) {
                currentUnit = 1;
            }
            updateDisplay();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                document.getElementById('prev-btn').click();
            } else if (e.key === 'ArrowRight') {
                document.getElementById('next-btn').click();
            }
        });

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
