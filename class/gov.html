<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #2596be;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .menu-bar {
            background: #0a0a0a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2596be;
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.3);
        }

        .menu-left {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .menu-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 2px solid #2596be;
            color: #2596be;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #2596be;
            color: #000;
            box-shadow: 0 0 15px rgba(37, 150, 190, 0.6);
        }

        .btn.active {
            background: #2596be;
            color: #000;
        }

        select {
            background: #000;
            border: 2px solid #2596be;
            color: #2596be;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        select option {
            background: #000;
            color: #2596be;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: calc(100vh - 70px);
        }

        .flashcard-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            height: calc(100vh - 200px);
        }

        .arrow-btn {
            background: transparent;
            border: none;
            color: #2596be;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 20px;
        }

        .arrow-btn:hover {
            color: #4db8e8;
            text-shadow: 0 0 20px rgba(37, 150, 190, 0.8);
        }

        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .flashcard {
            width: 700px;
            height: 450px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 3px solid #2596be;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(37, 150, 190, 0.4);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .flashcard-back {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            transform: rotateY(180deg);
        }

        .term {
            font-size: 36px;
            font-weight: bold;
            color: #4db8e8;
            text-align: center;
            text-shadow: 0 0 10px rgba(77, 184, 232, 0.5);
        }

        .definition {
            font-size: 20px;
            color: #2596be;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .simdef {
            font-size: 16px;
            color: #4db8e8;
            text-align: center;
            font-style: italic;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2596be;
        }

        .card-info {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #2596be;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .quiz-question {
            font-size: 28px;
            color: #4db8e8;
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            border: 2px solid #2596be;
            border-radius: 10px;
            background: #0a0a0a;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quiz-option {
            padding: 20px;
            border: 2px solid #2596be;
            border-radius: 8px;
            background: #0a0a0a;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quiz-option:hover {
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(37, 150, 190, 0.4);
        }

        .quiz-option.correct {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .quiz-option.incorrect {
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .option-number {
            color: #4db8e8;
            font-weight: bold;
            font-size: 20px;
        }

        .quiz-input {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            background: #0a0a0a;
            border: 2px solid #2596be;
            color: #2596be;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .list-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .list-item {
            padding: 20px;
            border: 2px solid #2596be;
            border-radius: 8px;
            background: #0a0a0a;
            cursor: pointer;
            transition: all 0.3s;
        }

        .list-item:hover {
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
            transform: translateY(-5px);
        }

        .list-item-term {
            font-size: 20px;
            font-weight: bold;
            color: #4db8e8;
            margin-bottom: 10px;
        }

        .list-item-def {
            font-size: 14px;
            color: #2596be;
        }

        .hidden {
            display: none;
        }

        .quiz-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-result {
            text-align: center;
            font-size: 24px;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
        }

        .quiz-result.correct {
            color: #00ff00;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .quiz-result.incorrect {
            color: #ff0000;
            border: 2px solid #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: transparent;
            border: 2px solid #2596be;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: #2596be;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #2596be;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
            background-color: #000;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            color: #2596be;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="menu-bar">
        <div class="menu-left">
            <button class="btn active" id="flashcardModeBtn">Flashcards</button>
            <button class="btn" id="quizModeBtn">Quiz</button>
            <button class="btn" id="listModeBtn">List</button>
        </div>
        <div class="menu-right">
            <select id="unitSelector">
                <option value="all">All Units</option>
            </select>
            <button class="btn" id="shuffleBtn">Shuffle</button>
            <div class="toggle-container" id="quizToggleContainer" style="display: none;">
                <span class="toggle-label">Reverse</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="reverseToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Flashcard Mode -->
        <div id="flashcardMode">

                        <div class="flashcard-face flashcard-back">
                            <div class="definition" id="cardDef"></div>
                            <div class="simdef" id="cardSimdef"></div>
                        </div>
                    </div>
                </div>
                <button class="arrow-btn" id="nextCard">›</button>
            </div>
            <div class="card-info" id="cardInfo"></div>
        </div>

        <!-- Quiz Mode -->
        <div id="quizMode" class="hidden">
            <div class="quiz-container">
                <div class="quiz-controls">
                    <button class="btn" id="multipleChoiceBtn">Multiple Choice</button>
                    <button class="btn" id="typeAnswerBtn">Type Answer</button>
                </div>
                <div class="quiz-question" id="quizQuestion"></div>
                <div id="quizContent"></div>
                <div id="quizResult" class="quiz-result hidden"></div>
            </div>
        </div>

        <!-- List Mode -->
        <div id="listMode" class="hidden">
            <div class="list-view" id="listView"></div>
        </div>
    </div>

  {

  {

  },
  {

  },
  {

  },
  {

  {

    "unit": "5",
  },
  {
    "term": "Caucus",

    "unit": "5",
  },
  {

    "simdef": "Voters choose party nominees directly",

  },
  {
    "term": "Closed Primary",

    "simdef": "Only party members can vote",
    "unit": "5",
  },
  {
    "term": "Open Primary",

    "simdef": "Any voter can choose a primary",
    "unit": "5",
  },
  {
    "term": "Blanket Primary",
    "def": "A primary election where voters can select candidates from any party for each office. It allows cross-party voting but was ruled unconstitutional for partisan offices in many states.",
    "simdef": "Vote across parties in primary",
    "unit": "5",
  },
  {
    "term": "PAC’s",

    "simdef": "Groups funding political campaigns",
    "unit": "5",
  },
  {
    "term": "527",
    "def": "Tax-exempt organizations created to influence elections through issue advocacy and voter mobilization. They can raise unlimited funds but must disclose donors and cannot directly coordinate with campaigns.",
    "simdef": "Tax-exempt political advocacy groups",
    "unit": "5",
  },
  {
    "term": "Independent Expenditures",

    "simdef": "Unaffiliated campaign spending",

  },
  {
    "term": "Party Caucus",
    "def": "A meeting of party members in Congress or state legislatures to coordinate policy, select leaders, and plan legislative strategy. It helps unify party actions in government.",
    "simdef": "Party meeting for coordination",
    "unit": "5",
  },
  {
    "term": "Super Tuesday",
    "def": "A key day in the presidential primary season when many states hold primaries and caucuses simultaneously. Results often shape momentum and determine leading candidates for nominations.",

    "unit": "5",
  },
  {
    "term": "Split Ticket",

    "unit": "5",
  },
  {
    "term": "Straight Ticket",
    "def": "Voting exclusively for one party’s candidates across all offices in an election. It reflects strong party loyalty and simplifies the voting process for partisan voters.",

    "unit": "5",
  },
  {
    "term": "Political Machine",

    "simdef": "Party organization controlling politics",
    "unit": "5",
  },
  {
    "term": "Two-Party System",

    "simdef": "Two main parties dominate politics",

  {

  },

    "unit": "5",
  },
  {

  {

  },

  {

  {
    "term": "Soft Money",

        let currentCardIndex = 0;
        let currentCards = [];
        let currentMode = 'flashcard';
        let quizType = 'multiple';
        let currentQuizAnswer = null;
        let reverseMode = false;

        const flashcard = document.getElementById('flashcard');
        const cardTerm = document.getElementById('cardTerm');
        const cardDef = document.getElementById('cardDef');
        const cardSimdef = document.getElementById('cardSimdef');
        const cardInfo = document.getElementById('cardInfo');
        const unitSelector = document.getElementById('unitSelector');
        const prevCard = document.getElementById('prevCard');
        const nextCard = document.getElementById('nextCard');

        // Initialize
        function init() {
            populateUnitSelector();
            currentCards = [...flashcardsData];
            loadCard();
            updateCardInfo();
        }

        function populateUnitSelector() {
            const units = [...new Set(flashcardsData.map(card => card.unit))].sort();
            units.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                // Use custom unit name if defined, otherwise use "Unit [number]"
                option.textContent = unitNames[unit] || `Unit ${unit}`;
                unitSelector.appendChild(option);
            });
        }

        function filterByUnit() {
            const selectedUnit = unitSelector.value;
            if (selectedUnit === 'all') {
                currentCards = [...flashcardsData];
            } else {
                currentCards = flashcardsData.filter(card => card.unit === selectedUnit);
            }
            currentCardIndex = 0;
            loadCard();
            updateCardInfo();
        }

        function loadCard() {
            if (currentCards.length === 0) return;
            const card = currentCards[currentCardIndex];
            cardTerm.textContent = card.term;
            cardDef.textContent = card.def;
            cardSimdef.textContent = card.simdef;
            flashcard.classList.remove('flipped');
            
            prevCard.disabled = currentCardIndex === 0;
            nextCard.disabled = currentCardIndex === currentCards.length - 1;
        }

        function updateCardInfo() {
            cardInfo.textContent = `Card ${currentCardIndex + 1} of ${currentCards.length}`;
        }

        // Flashcard navigation
        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('flipped');
        });

        prevCard.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                loadCard();
                updateCardInfo();
            }
        });

        nextCard.addEventListener('click', () => {
            if (currentCardIndex < currentCards.length - 1) {
                currentCardIndex++;
                loadCard();
                updateCardInfo();
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (currentMode === 'flashcard') {
                if (e.key === 'ArrowLeft') {
                    prevCard.click();
                } else if (e.key === 'ArrowRight') {
                    nextCard.click();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    flashcard.click();
                }
            } else if (currentMode === 'quiz' && quizType === 'multiple') {
                if (e.key >= '1' && e.key <= '4') {
                    const options = document.querySelectorAll('.quiz-option');
                    if (options[e.key - 1]) {
                        options[e.key - 1].click();
                    }
                }
            }
        });

        // Unit selector
        unitSelector.addEventListener('change', () => {
            filterByUnit();
            // Refresh current mode view
            if (currentMode === 'list') {
                loadList();
            } else if (currentMode === 'quiz') {
                loadQuiz();
            }
        });

        // Shuffle
        document.getElementById('shuffleBtn').addEventListener('click', () => {
            for (let i = currentCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
            }
            currentCardIndex = 0;
            loadCard();
            updateCardInfo();
            // Refresh current mode view
            if (currentMode === 'list') {
                loadList();
            } else if (currentMode === 'quiz') {
                loadQuiz();
            }
        });

        // Mode switching
        document.getElementById('flashcardModeBtn').addEventListener('click', () => {
            switchMode('flashcard');
        });

        document.getElementById('quizModeBtn').addEventListener('click', () => {
            switchMode('quiz');
            loadQuiz();
        });

        document.getElementById('listModeBtn').addEventListener('click', () => {
            switchMode('list');
            loadList();
        });

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('flashcardMode').classList.add('hidden');
            document.getElementById('quizMode').classList.add('hidden');
            document.getElementById('listMode').classList.add('hidden');

            document.querySelectorAll('.menu-left .btn').forEach(btn => btn.classList.remove('active'));

            // Toggle visibility of shuffle button and reverse toggle
            const shuffleBtn = document.getElementById('shuffleBtn');
            const quizToggleContainer = document.getElementById('quizToggleContainer');

            if (mode === 'flashcard') {
                document.getElementById('flashcardMode').classList.remove('hidden');
                document.getElementById('flashcardModeBtn').classList.add('active');
                shuffleBtn.style.display = 'block';
                quizToggleContainer.style.display = 'none';
            } else if (mode === 'quiz') {
                document.getElementById('quizMode').classList.remove('hidden');
                document.getElementById('quizModeBtn').classList.add('active');
                shuffleBtn.style.display = 'none';
                quizToggleContainer.style.display = 'flex';
            } else if (mode === 'list') {
                document.getElementById('listMode').classList.remove('hidden');
                document.getElementById('listModeBtn').classList.add('active');
                shuffleBtn.style.display = 'block';
                quizToggleContainer.style.display = 'none';
            }
        }

        // Quiz Mode
        function loadQuiz() {
            if (currentCards.length === 0) return;
            currentQuizAnswer = null;
            document.getElementById('quizResult').classList.add('hidden');
            
            const randomCard = currentCards[Math.floor(Math.random() * currentCards.length)];
            
            if (reverseMode) {
                // Show definition as question, term as answer
                document.getElementById('quizQuestion').textContent = randomCard.def;
                currentQuizAnswer = randomCard.term;
            } else {
                // Normal mode: show term as question, definition as answer
                document.getElementById('quizQuestion').textContent = randomCard.term;
                currentQuizAnswer = randomCard.def;
            }

            if (quizType === 'multiple') {
                loadMultipleChoice(randomCard);
            } else {
                loadTypeAnswer();
            }
        }

        function loadMultipleChoice(correctCard) {
            const options = [correctCard];
            while (options.length < 4) {
                const randomCard = currentCards[Math.floor(Math.random() * currentCards.length)];
                if (!options.includes(randomCard)) {
                    options.push(randomCard);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = '<div class="quiz-options"></div>';
            const optionsContainer = quizContent.querySelector('.quiz-options');

            options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                
                // Show term or def based on reverse mode
                const optionText = reverseMode ? option.term : option.def;
                const correctAnswer = reverseMode ? correctCard.term : correctCard.def;
                
                optionDiv.innerHTML = `<span class="option-number">${index + 1}</span><span>${optionText}</span>`;
                optionDiv.addEventListener('click', () => checkAnswer(optionText === correctAnswer, optionDiv));
                optionsContainer.appendChild(optionDiv);
            });
        }

        function loadTypeAnswer() {
            const quizContent = document.getElementById('quizContent');
            quizContent.innerHTML = `
                <input type="text" class="quiz-input" id="typeInput" placeholder="Type your answer...">
                <button class="btn" id="submitAnswer">Submit</button>
            `;

            const input = document.getElementById('typeInput');
            const submitBtn = document.getElementById('submitAnswer');

            input.focus();
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });

            submitBtn.addEventListener('click', () => {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = currentQuizAnswer.toLowerCase();
                const isCorrect = correctAnswer.includes(userAnswer) && userAnswer.length > 3;
                checkAnswer(isCorrect);
            });
        }

        function checkAnswer(isCorrect, optionElement = null) {
            const resultDiv = document.getElementById('quizResult');
            resultDiv.classList.remove('hidden', 'correct', 'incorrect');

            if (isCorrect) {
                resultDiv.textContent = '✓ Correct!';
                resultDiv.classList.add('correct');
                if (optionElement) optionElement.classList.add('correct');
            } else {
                resultDiv.textContent = `✗ Incorrect. The answer is: ${currentQuizAnswer}`;
                resultDiv.classList.add('incorrect');
                if (optionElement) optionElement.classList.add('incorrect');
            }

            setTimeout(() => {
                loadQuiz();
            }, 2500);
        }

        document.getElementById('multipleChoiceBtn').addEventListener('click', () => {
            quizType = 'multiple';
            loadQuiz();
        });

        document.getElementById('typeAnswerBtn').addEventListener('click', () => {
            quizType = 'type';
            loadQuiz();
        });

        // Reverse toggle
        document.getElementById('reverseToggle').addEventListener('change', (e) => {
            reverseMode = e.target.checked;
            loadQuiz();
        });

        // List Mode
        function loadList() {
            const listView = document.getElementById('listView');
            listView.innerHTML = '';

            currentCards.forEach((card, index) => {
                const listItem = document.createElement('div');
                listItem.className = 'list-item';
                listItem.innerHTML = `
                    <div class="list-item-term">${card.term}</div>
                    <div class="list-item-def">${card.def}</div>
                `;
                listItem.addEventListener('click', () => {
                    currentCardIndex = index;
                    switchMode('flashcard');
                    loadCard();
                    updateCardInfo();
                });
                listView.appendChild(listItem);
            });
        }

        init();
    </script>
</body>
</html>
