<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducationManager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #2596be;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 40px 20px;
        }

        #header {
            text-align: center;
            margin-bottom: 50px;
        }

        #logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
        }

        h1 {
            font-size: 32px;
            text-shadow: 0 0 15px #2596be;
            animation: fadeIn 1.5s ease-in forwards;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        #container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2596be;
            text-shadow: 0 0 10px #2596be;
        }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .page-card {
            background: rgba(37, 150, 190, 0.1);
            border: 2px solid #2596be;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .page-card:hover {
            background: rgba(37, 150, 190, 0.2);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
            transform: translateY(-5px);
        }

        .page-card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .page-card-desc {
            font-size: 12px;
            opacity: 0.7;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #c92a2a;
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        .add-page-btn {
            background: rgba(37, 150, 190, 0.2);
            border: 2px dashed #2596be;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 16px;
        }

        .add-page-btn:hover {
            background: rgba(37, 150, 190, 0.3);
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #000;
            border: 3px solid #2596be;
            border-radius: 12px;
            width: 90%;
            height: 90%;
            max-width: 1400px;
            max-height: 1200px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(37, 150, 190, 0.7);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid #2596be;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(37, 150, 190, 0.1);
        }

        .modal-title {
            font-size: 24px;
            text-shadow: 0 0 10px #2596be;
        }

        .close-btn {
            background: none;
            border: 2px solid #2596be;
            color: #2596be;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #2596be;
            color: #000;
            box-shadow: 0 0 15px #2596be;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .modal-body::-webkit-scrollbar {
            width: 12px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: #111;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: #2596be;
            border-radius: 6px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #4db8e8;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            min-height: 600px;
        }

        /* Add Page Form */
        .add-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            background: rgba(37, 150, 190, 0.1);
            border: 2px solid #2596be;
            color: #2596be;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(37, 150, 190, 0.5);
        }

        .form-btn {
            background: #2596be;
            border: none;
            color: #000;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .form-btn:hover {
            background: #4db8e8;
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.7);
        }

        .shortcut-key {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #2596be;
        }
    </style>
</head>
<body>
    <div id="header">
        <svg id="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="fishGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite" />
                    <animate attributeName="x2" values="100%;0%;100%" dur="4s" repeatCount="indefinite" />
                    <stop offset="0%" style="stop-color:#2596be;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4db8e8;stop-opacity:1" />
                </linearGradient>
            </defs>
            <ellipse cx="100" cy="100" rx="60" ry="30" fill="url(#fishGradient)" />
            <path d="M 40 100 L 10 85 L 20 100 L 10 115 Z" fill="url(#fishGradient)" />
            <circle cx="130" cy="95" r="8" fill="#000" />
            <circle cx="133" cy="93" r="3" fill="#fff" />
            <ellipse cx="90" cy="125" rx="15" ry="8" fill="url(#fishGradient)" opacity="0.8" />
            <ellipse cx="90" cy="75" rx="15" ry="8" fill="url(#fishGradient)" opacity="0.8" />
        </svg>
        <h1>[ WEB INTERFACE ]</h1>
        <div class="subtitle">Press <span class="shortcut-key">ALT+Z</span> for Home Screen | <span class="shortcut-key">ALT+X</span> for Others Page | <span class="shortcut-key">ALT+C</span> for Education | <span class="shortcut-key">ALT+V</span> for Web</div>
    </div>

    <div id="container">
        <!-- Default Pages Section -->
        <div class="section">
            <div class="section-title">&gt; SYSTEM PAGES</div>
            <div id="default-pages" class="page-grid"></div>
        </div>
<!--

||||||||||||||||||COMMENT THIS IN OR OUT IF YOU WANT USER ADDED PAGES-->
     
        <div class="section">
            <div class="section-title">&gt; MY PAGES *(most pages from big companies will not work, but still try)</div>
            <div id="user-pages" class="page-grid">
                <div class="add-page-btn" onclick="openAddPageModal()">
                    + ADD NEW PAGE
                </div>
            </div>
        </div>
    </div>



    <!-- Page Modal -->
    <div id="page-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"></div>
                <button class="close-btn" onclick="closeModal()">[ ESC ] CLOSE</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Add Page Modal -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">+ ADD NEW PAGE</div>
                <button class="close-btn" onclick="closeAddModal()">[ ESC ] CLOSE</button>
            </div>
            <div class="modal-body">
                <form class="add-form" onsubmit="addUserPage(event)">
                    <div class="form-group">
                        <label class="form-label">Page Title:</label>
                        <input type="text" class="form-input" id="page-title" placeholder="Enter page title..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Page Description:</label>
                        <input type="text" class="form-input" id="page-desc" placeholder="Enter description...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Embed URL (must be embeddable):</label>
                        <input type="url" class="form-input" id="page-url" placeholder="https://example.com" required>
                    </div>
                    <button type="submit" class="form-btn">ADD PAGE</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ===== EASY CONFIGURATION =====
        
        // Keyboard shortcuts
        const shortcuts = [
        { key: 'z', alt: true, url: '/index.html', description: 'Home Page' },
            { key: 'x', alt: true, url: 'other/index.html', description: 'Others' },
            { key: 'c', alt: true, url: 'class/index.html', description: 'Education' },
            { key: 'v', alt: true, url: 'web/index.html', description: 'Web' }
        ];

        // Default page groups - easily add or modify
        const defaultPageGroups = [
            {
                title: 'Remote Computer',
                description: 'A in development computer',
                url: 'web/remote.html'
            },
             {
                title: 'Computer',
                description: 'A in full virtual computer',
                url: 'web/computer.html'
            },
            {
                title: 'Remote Browser',
                description: 'A browser that can access anything',
                url: 'web/rb.html'
            },
            {
                title: 'Simple Browser',
                description: 'Quicker than adding a page',
                url: 'web/sp.html'
            },
           {
                title: 'YouTube',
                description: 'Until the county realises what they have done',
                url: 'web/yt.html'
            },
          
        ];

        // ===== END CONFIGURATION =====

        // Load user pages from localStorage
        let userPages = JSON.parse(localStorage.getItem('userPages') || '[]');

        // Render default pages
        function renderDefaultPages() {
            const container = document.getElementById('default-pages');
            container.innerHTML = '';
            
            defaultPageGroups.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.onclick = () => openPageModal(page.title, page.url);
                card.innerHTML = `
                    <div class="page-card-title">${page.title}</div>
                    <div class="page-card-desc">${page.description}</div>
                `;
                container.appendChild(card);
            });
        }

        // Render user pages
        function renderUserPages() {
            const container = document.getElementById('user-pages');
            const addBtn = container.querySelector('.add-page-btn');
            container.innerHTML = '';
            
            userPages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteUserPage(${index})">×</button>
                    <div class="page-card-title">${page.title}</div>
                    <div class="page-card-desc">${page.description || 'Custom page'}</div>
                `;
                card.onclick = () => openPageModal(page.title, page.url);
                container.appendChild(card);
            });
            
            container.appendChild(addBtn);
        }

        // Open page modal
        function openPageModal(title, url) {
            const modal = document.getElementById('page-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            
            modalTitle.textContent = title;
            modalBody.innerHTML = `<iframe src="${url}" allow="fullscreen; autoplay; encrypted-media"></iframe>`;
            modal.classList.add('active');
        }

        // Close page modal
        function closeModal() {
            const modal = document.getElementById('page-modal');
            modal.classList.remove('active');
            document.getElementById('modal-body').innerHTML = '';
        }

        // Open add page modal
        function openAddPageModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        // Close add page modal
        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
            document.getElementById('page-title').value = '';
            document.getElementById('page-desc').value = '';
            document.getElementById('page-url').value = '';
        }

        // Add user page
        function addUserPage(event) {
            event.preventDefault();
            
            const title = document.getElementById('page-title').value;
            const description = document.getElementById('page-desc').value;
            const url = document.getElementById('page-url').value;
            
            userPages.push({ title, description, url });
            localStorage.setItem('userPages', JSON.stringify(userPages));
            
            renderUserPages();
            closeAddModal();
        }

        // Delete user page
        function deleteUserPage(index) {
            if (confirm('Are you sure you want to delete this page?')) {
                userPages.splice(index, 1);
                localStorage.setItem('userPages', JSON.stringify(userPages));
                renderUserPages();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Close modals with ESC
            if (e.key === 'Escape') {
                closeModal();
                closeAddModal();
            }
            
            // Navigation shortcuts
            shortcuts.forEach(shortcut => {
                if (e.altKey === shortcut.alt && e.key.toLowerCase() === shortcut.key.toLowerCase()) {
                    e.preventDefault();
                    window.location.href = shortcut.url;
                }
            });
        });

        // Initialize
        renderDefaultPages();
        renderUserPages();
    </script>
</body>
</html>
