<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Menu Modal -->
    <div id="mainMenu" class="modal active">
        <div class="modal-content menu-content">
            <h1>Chess Game</h1>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="openMode('humanVsBot')">Human vs Bot</button>
                <button class="menu-btn" onclick="openMode('humanVsHuman')">Human vs Human</button>
                <button class="menu-btn" onclick="openMode('drugs')">Drugs</button>
                <button class="menu-btn" onclick="openMode('puzzleDash')">Puzzle Dash</button>
                <button class="menu-btn" onclick="openMode('analysis')">Analysis</button>
            </div>
        </div>
    </div>

```
<!-- Setup Modal for Human vs Human -->
<div id="setupHvH" class="modal">
    <div class="modal-content setup-content">
        <h2>Human vs Human Setup</h2>
        <div class="setup-form">
            <label>Player 1 Name:</label>
            <input type="text" id="player1Name" value="Player 1">
            
            <label>Player 1 Color:</label>
            <select id="player1Color">
                <option value="white">White</option>
                <option value="black">Black</option>
            </select>
            
            <label>Player 2 Name:</label>
            <input type="text" id="player2Name" value="Player 2">
            
            <label>Player 2 Color:</label>
            <select id="player2Color">
                <option value="black">Black</option>
                <option value="white">White</option>
            </select>
            
            <button class="start-btn" onclick="startHumanVsHuman()">Start Game</button>
            <button class="back-btn" onclick="backToMenu()">Back</button>
        </div>
    </div>
</div>

<!-- Setup Modal for Human vs Bot -->
<div id="setupHvB" class="modal">
    <div class="modal-content setup-content">
        <h2>Human vs Bot Setup</h2>
        <div class="setup-form">
            <label>Your Name:</label>
            <input type="text" id="playerNameBot" value="Player">
            
            <label>Your Color:</label>
            <select id="playerColorBot">
                <option value="white">White</option>
                <option value="black">Black</option>
                <option value="random">Random</option>
            </select>
            
            <label>Bot Difficulty (ELO):</label>
            <select id="botDifficulty">
                <option value="200">200</option>
                <option value="600">600</option>
                <option value="800">800</option>
                <option value="1000">1000</option>
                <option value="1200" selected>1200</option>
                <option value="1400">1400</option>
                <option value="1600">1600</option>
                <option value="2000">2000</option>
                <option value="2400">2400</option>
            </select>
            
            <button class="start-btn" onclick="startHumanVsBot()">Start Game</button>
            <button class="back-btn" onclick="backToMenu()">Back</button>
        </div>
    </div>
</div>

<!-- Puzzle Dash Modal -->
<div id="puzzleDash" class="modal">
    <div class="modal-content setup-content">
        <h2>Puzzle Dash</h2>
        <p>Puzzle Dash mode not available yet.</p>
        <button class="back-btn" onclick="backToMenu()">Back</button>
    </div>
</div>

<!-- Game Container -->
<div id="gameContainer" class="game-container">
    <div class="game-header">
        <button id="settingsBtn" onclick="openSettings()">Settings</button>
        <div id="moveHistory" class="move-history"></div>
    </div>
    
    <div class="game-board-wrapper">
        <div class="player-info top" id="topPlayerInfo">
            <div class="player-name" id="topPlayerName">Player 2</div>
            <div class="timer" id="topTimer">10:00</div>
            <div class="captured-pieces" id="topCaptured"></div>
        </div>
        
        <div class="board-container">
            <div class="rank-labels left" id="rankLabelsLeft"></div>
            <div class="board-wrapper">
                <div id="chessBoard" class="chess-board"></div>
                <div class="file-labels" id="fileLabels"></div>
            </div>
            <div class="rank-labels right" id="rankLabelsRight"></div>
        </div>
        
        <div class="player-info bottom" id="bottomPlayerInfo">
            <div class="captured-pieces" id="bottomCaptured"></div>
            <div class="timer" id="bottomTimer">10:00</div>
            <div class="player-name" id="bottomPlayerName">Player 1</div>
        </div>
    </div>
    
    <div id="evaluationBar" class="evaluation-bar"></div>
    <button id="switchTurnBtn" class="switch-turn-btn">Switch Turn</button>
    <button id="shuffleBoardBtn" class="shuffle-board-btn">Shuffle Board</button>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content settings-content">
        <h2>Settings</h2>
        <div class="settings-form">
            <label>Board Theme:</label>
            <select id="boardTheme" onchange="changeBoardTheme()">
                <option value="default">Navy Blue & Orange</option>
                <option value="blackWhite">Black & White</option>
                <option value="greenTan">Green & Tan</option>
                <option value="brownYellow">Brown & Yellowish</option>
            </select>
            
            <label>Rotate Board:</label>
            <button onclick="rotateBoard(90)">90 degrees</button>
            <button onclick="rotateBoard(180)">180 degrees</button>
            <button onclick="rotateBoard(270)">270 degrees</button>
            
            <label>Timer Mode:</label>
            <select id="timerMode" onchange="changeTimerMode()">
                <option value="off">Off</option>
                <option value="auto" selected>Auto</option>
                <option value="manual">Manual</option>
            </select>
            
            <div id="botSettings" style="display:none;">
                <label>Bot Response Time:</label>
                <select id="botResponseTime">
                    <option value="0">Immediate</option>
                    <option value="500">0.5-1s</option>
                    <option value="1000">1-2s</option>
                    <option value="1500" selected>1-3s</option>
                    <option value="2000">2-4s</option>
                    <option value="5000">5-7s</option>
                </select>
                
                <label>
                    <input type="checkbox" id="bestMoveHint" onchange="toggleBestMoveHint()">
                    Show Best Move Suggestion
                </label>
                
                <button onclick="switchSides()">Switch Sides</button>
            </div>
            
            <div id="drugsSettings" style="display:none;">
                <label>
                    <input type="checkbox" id="randomMode" onchange="toggleRandomMode()">
                    Random Mode
                </label>
            </div>
            
            <button class="back-btn" onclick="closeSettings()">Close</button>
            <button class="back-btn" onclick="quitGame()">Quit to Menu</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
```

</body>
</html>
