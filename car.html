<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search & Load Link</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .section {
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      margin-right: 10px;
      border-radius: 4px;
    }

    input, select {
      width: 60%;
      max-width: 600px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      background-color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Google Custom Search -->
  <div class="section">
    <script async src="https://cse.google.com/cse.js?cx=62965cfc6e0e44e4a"></script>
    <div class="gcse-search"></div>
  </div>

  <!-- URL Input Section -->
  <div class="section">
    <label for="linkInput">Enter a URL:</label><br>
    <input type="text" id="linkInput" placeholder="https://1games.io/gunspin />
    <button onclick="loadLink()">Load Link</button>
    <button onclick="goFullScreen()">Fullscreen</button>
  </div>

  <!-- Saved Links Dropdown -->
  <div class="section">
    <label for="savedLinks">Or load a saved link:</label><br>
    <select id="savedLinks" onchange="loadFromDropdown()">
      <option value="">-- Select a saved link --</option>
    </select>
  </div>

  <!-- Iframe Display -->
  <iframe id="customFrame" src=""></iframe>

  <script>
    const iframe = document.getElementById('customFrame');
    const savedLinksDropdown = document.getElementById('savedLinks');

    // Load a link from input and save it
    function loadLink() {
      const input = document.getElementById('linkInput').value.trim();

      if (!input.startsWith("http://") && !input.startsWith("https://")) {
        alert("Please enter a full URL starting with http:// or https://");
        return;
      }

      try {
        const url = new URL(input);
        iframe.src = url.href;
        saveLink(url.href);
      } catch {
        alert("Invalid URL");
      }
    }

    // Load saved links from localStorage
    function saveLink(url) {
      let links = JSON.parse(localStorage.getItem("savedLinks")) || [];
      if (!links.includes(url)) {
        links.push(url);
        localStorage.setItem("savedLinks", JSON.stringify(links));
        updateDropdown();
      }
    }

    // Populate dropdown
    function updateDropdown() {
      const links = JSON.parse(localStorage.getItem("savedLinks")) || [];
      savedLinksDropdown.innerHTML = '<option value="">-- Select a saved link --</option>';
      links.forEach(link => {
        const option = document.createElement('option');
        option.value = link;
        option.textContent = link;
        savedLinksDropdown.appendChild(option);
      });
    }

    // Load iframe from dropdown
    function loadFromDropdown() {
      const selected = savedLinksDropdown.value;
      if (selected) {
        iframe.src = selected;
      }
    }

    // Fullscreen the iframe
    function goFullScreen() {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.mozRequestFullScreen) {
        iframe.mozRequestFullScreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }

    // Init saved links on page load
    window.onload = updateDropdown;
  </script>

</body>
</html>
