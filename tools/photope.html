<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoPea</title>
    <style>
        /* Reset all spacing to ensure the iframe is truly fullscreen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #0E0B07; /* Matches your Archival theme background */
        }

        /* The Portal Frame */
        #portal-frame {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Loading indicator in the Archival style */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #F1E7CF;
            font-family: 'Red Hat Display', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: -1; /* Sits behind the iframe */
        }
    </style>
</head>
<body>

    <div id="loader">Establishing Connection...</div>

    <iframe 
        id="portal-frame" 
        src="https://photopea.com" 
        title="Archival External Content">
    </iframe>

</body>
</html>
