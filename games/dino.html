<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dine O' Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dark Mode (Aged Constitution at Night) */
            --bg-primary: #0E0B07;
            --surface-paper: #1A140C;
            --text-ink: #F1E7CF;
            --text-muted: #C7B995;
            --border-rule: #5A4A2A;
            --shadow: rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            /* Light Mode (Archival Parchment) */
            --bg-primary: #EFE6CF;
            --surface-paper: #FBF6E8;
            --text-ink: #2B2416;
            --text-muted: #4A3F2A;
            --border-rule: #CDBF9B;
            --shadow: rgba(0, 0, 0, 0.18);
        }

        body {
            margin: 0;
            background-color: var(--bg-primary);
            color: var(--text-ink);
            font-family: 'Red Hat Display', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.8s ease; /* Smooth transition for theme swap */
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 300px;
            background-color: var(--surface-paper);
            border: 1px solid var(--border-rule);
            box-shadow: 0 12px 40px var(--shadow);
            transition: background-color 0.8s ease, border-color 0.8s ease;
        }

        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }

        .screen { text-align: center; display: none; pointer-events: auto; }
        .screen.active { display: block; }

        h1 { font-weight: 600; font-size: 2.5rem; margin-bottom: 0; text-transform: uppercase; letter-spacing: 3px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-rule);
            padding-top: 1.5rem;
            width: 80%;
        }

        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 2px; }
        .stat-value { font-size: 1.8rem; font-weight: 600; display: block; }

        kbd { background: var(--bg-primary); border: 1px solid var(--border-rule); padding: 2px 6px; border-radius: 3px; color: var(--text-ink); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        
        <div id="ui-layer">
            <div id="start-screen" class="screen active">
                <h1>Dine O' Run</h1>
                <p style="color: var(--text-muted)">Press <kbd>Space</kbd> to Begin</p>
            </div>

            <div id="game-over-screen" class="screen">
                <h1 style="font-size: 1.5rem">GAME OVER</h1>
                <div class="stats-grid">
                    <div><span class="stat-label">High Score</span><span id="res-hi" class="stat-value">00000</span></div>
                    <div><span class="stat-label">Score</span><span id="res-sc" class="stat-value">00000</span></div>
                    <div><span class="stat-label">Time</span><span id="res-tm" class="stat-value">00:00</span></div>
                </div>
                <p style="margin-top: 1.5rem"><kbd>Space</kbd> to Restart</p>
            </div>
        </div>
    </div>

<script>
    // Initial theme from localStorage
    let currentTheme = localStorage.getItem('lightordark') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');

    let gameActive = false;
    let score = 0;
    let highScore = localStorage.getItem('dinoHighScore') || 0;
    let gameSpeed = 6.5;
    let startTime = 0;
    let frameCount = 0;
    let lastThemeCheckpoint = 0;
    let obstacles = [];

    const dino = {
        x: 50, y: 200, w: 44, h: 47,
        dy: 0, jumpForce: 13, gravity: 0.75,
        isGrounded: true, isDucking: false, leg: 0
    };

    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Space' && !gameActive) startGame();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
    }

    function startGame() {
        gameActive = true;
        score = 0;
        gameSpeed = 7;
        obstacles = [];
        lastThemeCheckpoint = 0;
        startTime = Date.now();
        startScreen.classList.remove('active');
        gameOverScreen.classList.remove('active');
        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        if (score > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem('dinoHighScore', highScore);
        }
        document.getElementById('res-hi').innerText = String(highScore).padStart(5, '0');
        document.getElementById('res-sc').innerText = String(Math.floor(score)).padStart(5, '0');
        document.getElementById('res-tm').innerText = formatTime(Date.now() - startTime);
        gameOverScreen.classList.add('active');
    }

    function formatTime(ms) {
        let totalSeconds = Math.floor(ms / 1000);
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function spawnObstacle() {
        if (score > 500 && Math.random() > 0.65) {
            const birdHeights = [160, 205, 235];
            obstacles.push({
                x: canvas.width,
                y: birdHeights[Math.floor(Math.random() * birdHeights.length)],
                w: 42, h: 28, type: 'bird'
            });
        } else {
            const count = Math.floor(Math.random() * 3) + 1;
            const isLarge = Math.random() > 0.5;
            obstacles.push({
                x: canvas.width,
                y: 270,
                w: (isLarge ? 15 : 10) * count, // Thinner widths
                h: isLarge ? 50 : 35,
                type: 'cactus',
                count: count,
                variant: isLarge ? 'large' : 'small'
            });
        }
    }

    function update() {
        // Theme Switching logic
        let currentCheckpoint = Math.floor(score / 500);
        if (currentCheckpoint > lastThemeCheckpoint) {
            lastThemeCheckpoint = currentCheckpoint;
            toggleTheme();
        }

        // Controls
        if ((keys['ArrowUp'] || keys['Space']) && dino.isGrounded && !dino.isDucking) {
            dino.dy = -dino.jumpForce;
            dino.isGrounded = false;
        }
        if (keys['ArrowDown'] && dino.isGrounded) {
            dino.isDucking = true;
            dino.h = 30;
        } else {
            dino.isDucking = false;
            dino.h = 47;
        }

        // Physics
        dino.y += dino.dy;
        if (!dino.isGrounded) dino.dy += dino.gravity;
        
        const ground = 270 - dino.h;
        if (dino.y > ground) {
            dino.y = ground;
            dino.dy = 0;
            dino.isGrounded = true;
        }

        // Increased Spawn Frequency (Lower threshold = more often)
        const spawnRate = Math.max(35, Math.floor(95 - gameSpeed * 3));
        if (frameCount % spawnRate === 0) spawnObstacle();

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= gameSpeed;

            // Hitbox
            if (dino.x + 12 < o.x + o.w && dino.x + dino.w - 12 > o.x &&
                dino.y + 8 < (o.type === 'cactus' ? 270 : o.y + o.h) && 
                dino.y + dino.h - 8 > (o.type === 'cactus' ? 270 - o.h : o.y)) {
                endGame();
            }
            if (o.x + o.w < 0) obstacles.splice(i, 1);
        }

        score += 0.15;
        gameSpeed += 0.0015; // Faster acceleration
        frameCount++;
        if (frameCount % 8 === 0) dino.leg = dino.leg === 0 ? 1 : 0;
    }

    function draw() {
        const style = getComputedStyle(document.documentElement);
        const ink = style.getPropertyValue('--text-ink');
        const muted = style.getPropertyValue('--text-muted');
        const rule = style.getPropertyValue('--border-rule');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ground Line
        ctx.strokeStyle = rule;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, 270); ctx.lineTo(canvas.width, 270); ctx.stroke();

        // Draw Dino
        ctx.fillStyle = ink;
        if (!dino.isDucking) {
            ctx.fillRect(dino.x + 10, dino.y, 25, 15); // Head
            ctx.fillRect(dino.x, dino.y + 15, 22, 20); // Body
            ctx.fillRect(dino.x + 22, dino.y + 15, 10, 5); // Neck
            const legX = dino.leg === 0 ? 5 : 15;
            ctx.fillRect(dino.x + legX, dino.y + 35, 6, 12);
            ctx.fillRect(dino.x + (legX === 5 ? 20 : 10), dino.y + 35, 6, 12);
            ctx.clearRect(dino.x + 28, dino.y + 4, 4, 4); // Eye
        } else {
            ctx.fillRect(dino.x, dino.y + 15, 55, 18);
            ctx.fillRect(dino.x + 40, dino.y + 15, 18, 12);
            ctx.fillRect(dino.x + 10, dino.y + 33, 6, 6);
            ctx.fillRect(dino.x + 35, dino.y + 33, 6, 6);
            ctx.clearRect(dino.x + 50, dino.y + 18, 3, 3);
        }

        // Draw Obstacles
        obstacles.forEach(o => {
            ctx.fillStyle = muted;
            if (o.type === 'cactus') {
                const individualW = o.variant === 'large' ? 12 : 7; // Thinner
                for(let i = 0; i < o.count; i++) {
                    const offsetX = i * (individualW + 5);
                    ctx.fillRect(o.x + offsetX, 270 - o.h, individualW, o.h);
                    // Arms
                    ctx.fillRect(o.x + offsetX - 3, 270 - o.h + 12, 3, 12);
                    ctx.fillRect(o.x + offsetX + individualW, 270 - o.h + 7, 3, 12);
                }
            } else {
                ctx.fillRect(o.x, o.y, o.w, 14); // Bird Body
                const wingY = (frameCount % 20 < 10) ? -10 : 10;
                ctx.fillRect(o.x + 10, o.y + wingY, 15, 8); // Wing
                ctx.fillRect(o.x + 35, o.y + 2, 8, 6); // Beak
            }
        });

        // HUD: HI 00000 SC 00000 TM 00:00
        ctx.fillStyle = ink;
        ctx.font = "600 13px 'Red Hat Display'";
        ctx.textAlign = "right";
        const hud = `HI ${String(highScore).padStart(5, '0')}  SC ${String(Math.floor(score)).padStart(5, '0')}  TM ${formatTime(Date.now() - startTime)}`;
        ctx.fillText(hud, canvas.width - 20, 30);
    }

    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    draw();
</script>
</body>
</html>
