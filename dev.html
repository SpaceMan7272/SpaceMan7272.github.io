<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            transition: transform 0.3s ease;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .menu-left {
            cursor: pointer;
            display: flex;
            gap: 10px;
        }
        .menu-center {
            display: flex;
            gap: 20px;
            justify-content: flex-start;
            flex-grow: 1;
            max-width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding-right: 20px;
        }
        .menu-center a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .menu-center a:hover {
            background-color: #555;
        }
        .menu-right {
            cursor: pointer;
        }
        .fullscreen-btn, .toggle-bar-btn {
            background-color: #444;
            padding: 8px 12px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .fullscreen-btn:hover, .toggle-bar-btn:hover {
            background-color: #555;
        }
        .game-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f1f1;
            margin-top: 60px; /* Prevent game content from hiding behind the fixed menu bar */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .popup.active {
            visibility: visible;
            opacity: 1;
        }
        .popup-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            width: 80%;
        }
        .popup-content .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            cursor: pointer;
        }
        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .game-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .game-list li {
            margin-bottom: 10px;
        }
        .game-list li a {
            color: #333;
            text-decoration: none;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 4px;
            display: block;
        }
        .game-list li a:hover {
            background-color: #ddd;
        }
        .link-input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="menu-bar" id="menuBar">
        <div class="menu-left">
            <button class="fullscreen-btn" onclick="toggleGameFullScreen()">Fullscreen</button>
            <button class="toggle-bar-btn" onclick="toggleMenuBar()">Hide Bar</button>
        </div>
        <div class="menu-center">
            <a href="index.html">Home</a>
            <a href="sing.html">Single</a>
            <a href="multi.html">Multi</a>
            <a href="ser.html">Series</a>
            <a href="io.html">IO</a>
            <a href="oth.html">Other</a>
            <a href="dev.html">Dev</a>
            <a href="search.html">o-</a>
        </div>
        <div class="menu-right">
            <span style="font-size: 30px; cursor: pointer;" onclick="togglePopup()">=</span>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <iframe id="gameFrame" src="https://2player.co/challenge-the-runners.embed" title="Game"></iframe>
    </div>

    <div class="popup" id="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="togglePopup()">×</span>
            <label for="gameLink">Enter Game Link:</label>
            <input type="text" class="link-input" id="gameLink" placeholder="Enter game URL here..." />
            <button onclick="loadGame()">Load Game</button>
        </div>
    </div>

    <script>
        function toggleGameFullScreen() {
            const iframe = document.getElementById('gameFrame');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        }

        function toggleMenuBar() {
            const menuBar = document.getElementById('menuBar');
            const button = document.querySelector('.toggle-bar-btn');

            if (menuBar.style.transform === "translateY(-100%)") {
                menuBar.style.transform = "translateY(0)";
                button.textContent = "Hide Bar";
            } else {
                menuBar.style.transform = "translateY(-100%)";
                button.textContent = "Show Bar";
            }
        }

        function togglePopup() {
            const popup = document.getElementById('popup');
            popup.classList.toggle('active');
        }

        function loadGame() {
            const gameLink = document.getElementById('gameLink').value;
            const iframe = document.getElementById('gameFrame');

            if (gameLink) {
                iframe.src = gameLink;
            } else {
                alert("Please enter a valid game link!");
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.altKey && event.key === 'c') {
                window.location.href = "https://clever.com";
                setTimeout(function() { window.close(); }, 1000);
            }
        });
    </script>

</body>
</html>
