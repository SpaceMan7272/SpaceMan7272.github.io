<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Matrix Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff00;
            transition: all 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.color-blue {
            --primary: #0066ff;
            --secondary: #0099ff;
            background: #0a0a2e;
        }

        body.color-green {
            --primary: #00ff00;
            --secondary: #00cc00;
            background: #0a0e27;
        }

        body.color-red {
            --primary: #ff0000;
            --secondary: #cc0000;
            background: #2a0a0a;
        }

        body.color-yellow {
            --primary: #ffff00;
            --secondary: #cccc00;
            background: #2a2a0a;
        }

        body.color-gray {
            --primary: #cccccc;
            --secondary: #999999;
            background: #1a1a1a;
        }

        body.color-white {
            --primary: #ffffff;
            --secondary: #e0e0e0;
            background: #1a1a1a;
        }

        :root {
            --primary: #00ff00;
            --secondary: #00cc00;
        }

        .container {
            padding: 40px;
            flex: 1;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 0 10px var(--primary);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px var(--primary); }
            50% { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--primary); }
        }

        .boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .box {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid var(--primary);
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .box:hover {
            box-shadow: 0 0 20px var(--primary), inset 0 0 20px rgba(0, 255, 0, 0.1);
            transform: scale(1.05);
            background: rgba(0, 255, 0, 0.1);
        }

        .box h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .box p {
            font-size: 0.9em;
            color: var(--secondary);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .boxes {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body class="color-green">
    <div class="container">
        <h1>> WELCOME TO THE GAMES</h1>
        <div class="boxes">
            <div class="box" onclick="openBox('game/blast.html')">
                <h2>Block Blast</h2>
                <p>Blast the Blocks!</p>
            </div>
            <div class="box" onclick="openBox('game/chess.html')">
                <h2>Chess</h2>
                <p>Its really old.</p>
            </div>
            <div class="box" onclick="openBox('game/bal.html')">
                <h2>BALATRO</h2>
                <p>GAMBLINGGGGGGG</p>
            </div>
            <div class="box" onclick="openBox('game/pzd.html')">
                <h2>chess puzzle rush</h2>
                <p>d</p>
            </div>
            <div class="box" onclick="openBox('example.html')">
                <h2>EXAMPLE 5</h2>
                <p>e</p>
            </div>
            <div class="box" onclick="openBox('example.html')">
                <h2>EXAMPLE 6</h2>
                <p>f</p>
            </div>
        </div>
    </div>

    <script>
        function openBox(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
