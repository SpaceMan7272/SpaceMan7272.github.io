<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AP Gov Flashcards & Quiz</title>
<style>
  :root{
    --bg:#0e0f12;
    --card:#141519;
    --muted:#9aa0a6;
    --accent:#6be4c1;
    --panel:#101214;
    --glass: rgba(255,255,255,0.03);
  }
  html,body{height:100%; margin:0;}
  body{
    background:linear-gradient(180deg,#08090b 0%, #0f1114 100%);
    color:#e6eef1;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px;
  }
  header{width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  h1{font-size:20px; margin:0; letter-spacing:0.4px;}
  .controls{display:flex; gap:8px; align-items:center;}
  select,input[type=number]{background:var(--panel); color:var(--muted); border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:8px;}
  button{
    background:linear-gradient(180deg,#1b1d21,#121315);
    color:#dff7ef;
    border:1px solid rgba(255,255,255,0.04);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  main{width:100%; max-width:1100px; margin-top:18px; display:flex; gap:20px; align-items:flex-start;}
  /* Left: card area */
  .left{flex:1; display:flex; flex-direction:column; align-items:center;}
  .card-wrap{width:560px; max-width:90vw; height:320px; perspective:1400px; margin:12px 0;}
  .card{
    width:100%; height:100%; border-radius:12px; position:relative; transform-style:preserve-3d; transition:transform .6s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; padding:22px; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:center; gap:10px;
  }
  .front{background:linear-gradient(180deg,#111317,#0e1013); border:1px solid rgba(255,255,255,0.03);}
  .back{background:linear-gradient(180deg,#16181b,#131417); border:1px solid rgba(255,255,255,0.03); transform:rotateY(180deg);}
  .term{font-size:28px; font-weight:600; letter-spacing:0.2px;}
  .def{font-size:15px; color:var(--muted); line-height:1.45;}
  .navs{display:flex; gap:12px; margin-top:8px;}
  .small{font-size:13px; color:var(--muted);}
  .navs button{min-width:120px;}
  /* Right: list & quiz area */
  .right{width:340px; max-width:33vw; min-width:260px; display:flex; flex-direction:column; gap:12px;}
  .list{background:var(--card); padding:12px; border-radius:10px; height:360px; overflow:auto; border:1px solid rgba(255,255,255,0.03);}
  .list-item{padding:8px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .list-item:hover{background:rgba(255,255,255,0.02);}
  .activeItem{background:linear-gradient(90deg, rgba(107,228,193,0.06), rgba(107,228,193,0.02)); border-left:3px solid var(--accent); padding-left:6px;}
  /* quiz */
  .quizPanel{background:var(--card); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.03);}
  .question{font-size:15px; color:var(--muted); min-height:52px;}
  .options{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .optBtn{background:transparent; color:#e7f6ee; border:1px solid rgba(255,255,255,0.04); padding:10px; border-radius:8px; cursor:pointer; text-align:left;}
  .optBtn.correct{border-color:rgba(107,228,193,0.7); background:rgba(107,228,193,0.06);}
  .optBtn.incorrect{border-color:rgba(255,140,140,0.2); background:rgba(255,80,80,0.04);}
  footer{width:100%; max-width:1100px; margin-top:18px; color:var(--muted); font-size:13px; text-align:center;}
  @media (max-width:900px){
    main{flex-direction:column; align-items:center;}
    .right{width:100%; max-width:90vw;}
  }
</style>
</head>
<body>
<header>
  <h1>AP Gov — Flashcards & Quiz </h1>
  <div class="controls">
    <label class="small">Unit:</label>
    <select id="unitSelect">
      <option value="all">All Units</option>
      <option value="0">Unit 0 — Amendments & Articles</option>
      <option value="1">Unit 1 </option>
      <option value="2">Unit 2 </option>
      <option value="3">Unit 3 </option>
    </select>
    <button id="flashBtn">Flashcards</button>
    <button id="quizBtn">Quiz</button>
    <button id="shuffleBtn" title="Shuffle cards">Shuffle</button>
  </div>
</header>

<main>
  <div class="left">
    <div class="card-wrap" title="Click or press Space to flip. Use ← → to navigate.">
      <div id="card" class="card" tabindex="0">
        <div class="face front">
          <div class="term" id="term">Term</div>
          <div class="def" id="frontHint">(Press Space to flip for definition)</div>
        </div>
        <div class="face back">
          <div class="def" id="definition">Definition</div>
        </div>
      </div>
    </div>

    <div class="navs">
      <button id="prevBtn">← Previous</button>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div class="small" id="pos">0 / 0</div>
        <div class="small" id="unitLabel">Unit: All</div>
      </div>
      <button id="nextBtn">Next →</button>
    </div>
  </div>

  <div class="right">
    <div class="list" id="listPanel" aria-label="cards list"></div>

    <div class="quizPanel" id="quizPanel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="small">Quiz Mode</div>
          <div class="small" id="quizInfo">Pick a unit and press "Quiz".</div>
        </div>
        <div style="text-align:right;">
          <div class="small">Questions:</div>
          <input id="numQ" type="number" min="5" max="50" value="10" style="width:72px;">
        </div>
      </div>
      <div style="height:12px"></div>
      <div class="question" id="qText">No quiz running</div>
      <div class="options" id="qOptions"></div>
      <div style="height:8px"></div>
      <div class="small" id="qProgress"></div>
    </div>
  </div>
</main>

<footer>
 made by us
</footer>

/* -----------------------
   App State
   ----------------------- */
let currentUnit = 'all';
let flatCards = []; // current working set
let index = 0;
let mode = 'flash'; // 'flash' or 'quiz'
let quizSet = [];
let quizQ = 0;
let quizTotal = 10;

/* -----------------------
   Helpers
   ----------------------- */
function flatten(unitKey){
  if(unitKey === 'all'){
    return [...DATA[0], ...DATA[1], ...DATA[2]];
  } else {
    return DATA[unitKey].slice();
  }
}

function renderList(){
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  flatCards.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className = 'list-item' + (i===index? ' activeItem' : '');
    div.innerHTML = `<div style="max-width:75%">${i+1}. ${c.term}</div><div class="small">${getUnitLabelForIndex(i)}</div>`;
    div.onclick = ()=>{ index = i; showCard(); renderList(); };
    panel.appendChild(div);
  });
}
function getUnitLabelForIndex(i){
  // Determine unit label based on cumulative lengths
  const u0 = DATA[0].length;
  const u1 = DATA[1].length;
  if(i < u0) return 'Unit 0';
  if(i < u0 + u1) return 'Unit 1';
  return 'Unit 2';
}
function showCard(){
  if(flatCards.length===0) return;
  const c = flatCards[index];
  document.getElementById('term').innerText = c.term;
  document.getElementById('frontHint').innerText = '(Press Space or click to flip. Use ← → to navigate.)';
  document.getElementById('definition').innerText = c.def;
  document.getElementById('pos').innerText = `${index+1} / ${flatCards.length}`;
  const unitLabel = document.getElementById('unitSelect').selectedOptions[0].text;
  document.getElementById('unitLabel').innerText = unitLabel;
  document.getElementById('card').classList.remove('flipped');
  renderList();
}
function flip(){
  const el = document.getElementById('card');
  el.classList.toggle('flipped');
}
function nextCard(){
  if(flatCards.length===0) return;
  index = (index + 1) % flatCards.length;
  showCard();
}
function prevCard(){
  if(flatCards.length===0) return;
  index = (index - 1 + flatCards.length) % flatCards.length;
  showCard();
}
function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* -----------------------
   UI wiring
   ----------------------- */
document.getElementById('unitSelect').addEventListener('change', ()=>{
  currentUnit = document.getElementById('unitSelect').value;
  flatCards = flatten(currentUnit);
  index = 0;
  showCard();
});

document.getElementById('flashBtn').addEventListener('click', ()=>{
  mode = 'flash';
  document.getElementById('quizInfo').innerText = 'Flashcard browsing active.';
  flatCards = flatten(currentUnit);
  index = 0;
  showCard();
});

document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  flatCards = shuffleArray(flatCards);
  index = 0;
  showCard();
});

document.getElementById('prevBtn').addEventListener('click', prevCard);
document.getElementById('nextBtn').addEventListener('click', nextCard);

document.getElementById('card').addEventListener('click', ()=>{
  if(mode === 'flash') flip();
});

document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){
    e.preventDefault();
    if(mode === 'flash') flip();
    return;
  }
  if(e.code === 'ArrowRight'){ nextCard(); }
  if(e.code === 'ArrowLeft'){ prevCard(); }
});

/* -----------------------
   Quiz logic
   ----------------------- */
document.getElementById('quizBtn').addEventListener('click', startQuiz);

function startQuiz(){
  mode = 'quiz';
  quizTotal = parseInt(document.getElementById('numQ').value) || 10;
  const pool = flatten(document.getElementById('unitSelect').value);
  quizSet = shuffleArray(pool.slice()).slice(0, Math.min(quizTotal, pool.length));
  quizQ = 0;
  document.getElementById('quizInfo').innerText = `Quiz: ${quizSet.length} questions. Definition shown — pick the correct term.`;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const qEl = document.getElementById('qText');
  const optsEl = document.getElementById('qOptions');
  const progressEl = document.getElementById('qProgress');
  optsEl.innerHTML = '';
  if(quizQ >= quizSet.length){
    qEl.innerText = 'Quiz complete! Well done.';
    progressEl.innerText = `Score complete. Restart quiz to play again.`;
    return;
  }
  const current = quizSet[quizQ];
  qEl.innerText = current.def;
  // build options: correct + 4 random distinct others
  const pool = flatten(document.getElementById('unitSelect').value);
  const options = [current.term];
  while(options.length < 5 && pool.length > 0){
    const pick = pool[Math.floor(Math.random()*pool.length)].term;
    if(!options.includes(pick)) options.push(pick);
  }
  shuffleArray(options);
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'optBtn';
    btn.innerText = opt;
    btn.onclick = ()=>handleAnswer(btn, opt, current.term);
    optsEl.appendChild(btn);
  });
  progressEl.innerText = `Question ${quizQ+1} / ${quizSet.length}`;
}

function handleAnswer(button, chosen, correct){
  const all = document.querySelectorAll('.optBtn');
  // disable all
  all.forEach(b=>b.disabled = true);
  if(chosen === correct){
    button.classList.add('correct');
  } else {
    button.classList.add('incorrect');
    // highlight correct
    for(const b of all){
      if(b.innerText === correct) b.classList.add('correct');
    }
  }
  setTimeout(()=>{
    quizQ++;
    // re-enable
    document.querySelectorAll('.optBtn').forEach(b=>{ b.disabled=false; b.className='optBtn'; });
    renderQuizQuestion();
  }, 900);
}

/* -----------------------
   Initialize
   ----------------------- */
(function init(){
  currentUnit = 'all';
  document.getElementById('unitSelect').value = 'all';
  flatCards = flatten('all');
  shuffleArray(flatCards);
  index = 0;
  showCard();
})();
</script>
