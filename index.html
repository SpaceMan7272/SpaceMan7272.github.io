<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Boot</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
        background:#000;
        color:#2596be;
        font-family:'Courier New', monospace;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    /* BOOT SCREEN */
    #boot-screen {
        text-align:center;
        opacity:1;
        transition:0.4s ease;
    }

    .boot-msg {
        font-size:18px;
        margin:8px 0;
        opacity:0;
        animation:fadeIn 0.8s forwards;
    }

    @keyframes fadeIn { to { opacity:1; } }

    /* MAIN MENU */
    #main-menu {
        display:none;
        width:100%;
        height:100%;
        padding:20px;
        gap:20px;
    }

    .grid {
        width:100%;
        height:100%;
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:1fr 1fr;
        gap:20px;
    }

    /* COOLER BOXES */
    .box {
        position:relative;
        overflow:hidden;
        border:2px solid rgba(37,150,190,0.6);
        background:linear-gradient(145deg, #001820, #002531);
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:26px;
        text-decoration:none;
        color:#4db8e8;

        box-shadow:0 0 15px rgba(37,150,190,0.3),
                    inset 0 0 20px rgba(37,150,190,0.15);

        transition:0.25s ease;
    }

    .box:hover {
        transform:translateY(-6px) scale(1.02);
        box-shadow:0 0 25px rgba(37,150,190,0.6),
                    inset 0 0 25px rgba(37,150,190,0.2);
        border-color:#4db8e8;
    }

    /* Neon animated edge glow */
    .box::after {
        content:"";
        position:absolute;
        inset:0;
        border:2px solid transparent;
        border-radius:0;
        pointer-events:none;
        animation:neonPulse 3s infinite ease-in-out;
    }

    @keyframes neonPulse {
        0% { box-shadow:0 0 10px #2596be; }
        50% { box-shadow:0 0 25px #4db8e8; }
        100% { box-shadow:0 0 10px #2596be; }
    }

    /* MOBILE: STACKED */
    @media(max-width:700px){
        .grid {
            display:flex;
            flex-direction:column;
        }
    }
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot-screen">
    <div class="boot-msg">Initializing system...</div>
    <div class="boot-msg">Loading modules...</div>
    <div class="boot-msg">Validating environment...</div>
    <div class="boot-msg">Preparing interface...</div>
</div>

<!-- MAIN MENU -->
<div id="main-menu">
    <div class="grid">

        <a href="#" class="box" data-url="index.html">HOME</a>
        <a href="other/index.html" class="box" data-url="other/index.html">OTHER</a>
        <a href="class/index.html" class="box" data-url="class/index.html">EDUCATION</a>
        <a href="web/index.html" class="box" data-url="web/index.html">WEB</a>

    </div>
</div>

<script>
/* ============================
   PASSWORD SYSTEM (unchanged)
============================ */
const allowedPasswords = [
    "pi","paayas","carson","hudson","lexi","joseph","jt","jaketyler","daniel",
    "mauhammad","johnston","cooper","justin","brycetin","claudia","hyder",
    "ryan","louis","hyder","uriel","veer","claire","holden","sumalee","jahaira",
    "tiffany","maheen","kaley","arron","brody","corbin","hugo","ethan",
    "grace","madylin","nia","val","abdash","max"
];

const alreadyAuthed = localStorage.getItem("auth_ok") === "true";

/* ============================
   1.5 SECOND BOOT
============================ */
setTimeout(() => {
    document.getElementById("boot-screen").style.opacity = "0";
    setTimeout(() => {
        document.getElementById("boot-screen").style.display = "none";
        document.getElementById("main-menu").style.display = "flex";
    }, 400);
}, 1500);

/* ============================
   CLICK-TO-OPEN WITH PASSWORD
============================ */
document.querySelectorAll(".box").forEach(box => {
    box.addEventListener("click", () => {

        const url = box.dataset.url;

        if (alreadyAuthed) {
            window.location.href = url;
            return;
        }

        const entered = prompt("The password is your first name. Enter to proceed:");

        if (!entered) return;

        if (allowedPasswords.includes(entered)) {
            localStorage.setItem("auth_ok", "true");
            window.location.href = url;
        } else {
            alert("Incorrect password.");
        }
    });
});
</script>

</body>
</html>
