<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #2596be;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #embedded-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: none; /* hidden until a button is selected */
        }

        /* Button menu container */
        #start-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            background: #000;
            color: #2596be;
            border: 2px solid #2596be;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 6px;
        }

        .menu-btn:hover {
            background: #2596be;
            color: #000;
        }

        /* Shortcut popup */
        #shortcut-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #2596be;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
        }

        #shortcut-indicator.show {
            opacity: 1;
        }

        .shortcut-line {
            margin: 3px 0;
        }

        .shortcut-key {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #2596be;
        }
    </style>
</head>
<body>

    <!-- START MENU (new) -->
    <div id="start-menu">
        <button class="menu-btn" onclick="openFrame(0)">Human v Bot</button>
        <button class="menu-btn" onclick="openFrame(1)">Human v Human</button>
        <button class="menu-btn" onclick="openFrame(2)">Puzzle Rush</button>
        <button class="menu-btn" onclick="openFrame(3)">Drugs</button>
    </div>

    <!-- Iframe (hidden until button press) -->
    <iframe id="embedded-frame" allow="fullscreen; autoplay; encrypted-media"></iframe>

    <!-- Shortcut indicator -->
    <div id="shortcut-indicator">
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+Z</span> - Home Screen</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+X</span> - Others</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+C</span> - Education</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+V</span> - Web</div>
    </div>

    <script>
        // ===== LINKS FOR BUTTONS =====
        const buttonLinks = [
            "https://ichess.com/",
            "human.html",
            "https://chesspuzzle.net/Puzzle/",
            "drug.html"
        ];

        function openFrame(index) {
            const frame = document.getElementById("embedded-frame");
            const menu = document.getElementById("start-menu");

            frame.src = buttonLinks[index];
            frame.style.display = "block";
            menu.style.display = "none";
        }
        // ==============================

        // SHORTCUT CONFIG
        const shortcuts = [
            { key: 'z', alt: true, url: '/index.html' },
            { key: 'x', alt: true, url: 'other/index.html' },
            { key: 'c', alt: true, url: 'class/index.html' },
            { key: 'v', alt: true, url: 'web/index.html' }
        ];

        const indicator = document.getElementById('shortcut-indicator');
        setTimeout(() => indicator.classList.add('show'), 500);
        setTimeout(() => indicator.classList.remove('show'), 5500);

        document.addEventListener('keydown', (e) => {
            shortcuts.forEach(s => {
                if (e.altKey === s.alt && e.key.toLowerCase() === s.key.toLowerCase()) {
                    e.preventDefault();
                    window.location.href = s.url;
                }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.altKey && !indicator.classList.contains('show')) {
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 3000);
            }
        });
    </script>
</body>
</html>
