<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Code Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #000;
            color: #2596be;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .title-bar {
            height: 5%;
            background: linear-gradient(135deg, #2596be 0%, #4db8e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #4db8e8;
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
        }

        .title-bar h1 {
            font-size: 20px;
            color: #000;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .main-content {
            height: 95%;
            display: flex;
        }

        .editor-side {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #2596be;
        }

        .tabs {
            display: flex;
            background: #000;
            border-bottom: 2px solid #2596be;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            background: rgba(37, 150, 190, 0.1);
            color: #2596be;
            border: none;
            border-right: 1px solid #2596be;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
        }

        .tab:last-child {
            border-right: none;
        }

        .tab:hover {
            background: rgba(37, 150, 190, 0.2);
        }

        .tab.active {
            background: linear-gradient(135deg, #2596be 0%, #4db8e8 100%);
            color: #000;
            box-shadow: 0 0 15px rgba(77, 184, 232, 0.6);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #4db8e8;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .code-editor {
            width: 100%;
            height: 100%;
            padding: 20px;
            background: #000;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.6;
            overflow: auto;
            display: none;
        }

        .code-editor.active {
            display: block;
        }

        .code-editor::-webkit-scrollbar {
            width: 8px;
        }

        .code-editor::-webkit-scrollbar-track {
            background: #000;
        }

        .code-editor::-webkit-scrollbar-thumb {
            background: #2596be;
            border-radius: 4px;
        }

        .code-editor::-webkit-scrollbar-thumb:hover {
            background: #4db8e8;
        }

        .preview-side {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .preview-header {
            background: rgba(37, 150, 190, 0.1);
            padding: 12px 20px;
            border-bottom: 2px solid #2596be;
            color: #2596be;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-header::before {
            content: '●';
            color: #4db8e8;
            font-size: 18px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .preview-frame {
            flex: 1;
            border: none;
            background: #fff;
        }

        .button-group {
            display: flex;
            gap: 0;
            border-top: 2px solid #2596be;
            background: #000;
        }

        button.action-btn {
            flex: 1;
            padding: 15px;
            background: rgba(37, 150, 190, 0.2);
            color: #2596be;
            border: none;
            border-right: 1px solid #2596be;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button.action-btn:last-child {
            border-right: none;
        }

        button.action-btn:hover {
            background: linear-gradient(135deg, #2596be 0%, #4db8e8 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(77, 184, 232, 0.6);
        }

        /* Syntax highlighting colors */
        .code-editor {
            color: #2596be;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .editor-side, .preview-side {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-bar">
            <h1>CODE EDITOR_</h1>
        </div>

        <div class="main-content">
            <div class="editor-side">
                <div class="tabs">
                    <button class="tab active" data-tab="html"> HTML</button>
                    <button class="tab" data-tab="css"> CSS</button>
                    <button class="tab" data-tab="js"> JS</button>
                </div>

                <div class="editor-container">
                    <textarea class="code-editor active" id="htmlEditor" spellcheck="false"><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Hello Terminal</h1>
  <p>Start coding...</p>
  <script src="script.js"></script>
</body>
</html></textarea>

                    <textarea class="code-editor" id="cssEditor" spellcheck="false">body {
  font-family: monospace;
  background: #000;
  color: #2596be;
  padding: 20px;
}

h1 {
  text-shadow: 0 0 10px #2596be;
  color: #4db8e8;
}</textarea>

                    <textarea class="code-editor" id="jsEditor" spellcheck="false">console.log('Terminal initialized...');

// Your code here</textarea>
                </div>

                <div class="button-group">
                    <button class="action-btn" id="runBtn">▶ Run</button>
                    <button class="action-btn" id="downloadBtn">⬇ Download</button>
                    <button class="action-btn" id="clearBtn">⟲ Reset</button>
                </div>
            </div>

            <div class="preview-side">
                <div class="preview-header">
                    Live Preview
                </div>
                <iframe class="preview-frame" id="preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('htmlEditor');
        const cssEditor = document.getElementById('cssEditor');
        const jsEditor = document.getElementById('jsEditor');
        const preview = document.getElementById('preview');
        const tabs = document.querySelectorAll('.tab');
        const editors = document.querySelectorAll('.code-editor');
        const runBtn = document.getElementById('runBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.getAttribute('data-tab');
                
                tabs.forEach(t => t.classList.remove('active'));
                editors.forEach(e => e.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(targetTab + 'Editor').classList.add('active');
            });
        });

        // Auto-indent on Enter key
        function setupAutoIndent(editor) {
            editor.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const value = this.value;
                    const lastLine = value.substring(0, start).split('\n').pop();
                    const indent = lastLine.match(/^\s*/)[0];
                    
                    let newIndent = indent;
                    if (lastLine.trim().endsWith('{') || lastLine.trim().endsWith('<')) {
                        newIndent += '  ';
                    }
                    
                    const newValue = value.substring(0, start) + '\n' + newIndent + value.substring(start);
                    this.value = newValue;
                    this.selectionStart = this.selectionEnd = start + newIndent.length + 1;
                }
                
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 2;
                }
            });
        }

        setupAutoIndent(htmlEditor);
        setupAutoIndent(cssEditor);
        setupAutoIndent(jsEditor);

        // Syntax highlighting with color
        function applySyntaxHighlight(editor, lang) {
            const text = editor.value;
            let highlighted = text;

            if (lang === 'html') {
                // HTML tags in bright cyan
                highlighted = highlighted.replace(/(&lt;[^&gt;]+&gt;)/g, '<span style="color: #4db8e8;">$1</span>');
            } else if (lang === 'css') {
                // CSS properties in teal
                highlighted = highlighted.replace(/([a-z-]+)(\s*:)/g, '<span style="color: #4db8e8;">$1</span>$2');
            } else if (lang === 'js') {
                // JS keywords in bright cyan
                highlighted = highlighted.replace(/\b(const|let|var|function|return|if|else|for|while)\b/g, '<span style="color: #4db8e8;">$1</span>');
            }
        }

        // Run code and update preview
        function runCode() {
            const html = htmlEditor.value;
            const css = cssEditor.value;
            const js = jsEditor.value;

            const htmlWithLinks = html
                .replace(/<link[^>]*href=["']styles\.css["'][^>]*>/gi, '')
                .replace(/<script[^>]*src=["']script\.js["'][^>]*><\/script>/gi, '')
                .replace('</head>', '<style>' + css + '</style></head>')
                .replace('</body>', '<script>' + js + '<' + '/script></body>');

            const previewDoc = preview.contentDocument || preview.contentWindow.document;
            previewDoc.open();
            previewDoc.write(htmlWithLinks);
            previewDoc.close();
        }

        // Download files
        function downloadFiles() {
            const files = [
                { name: 'index.html', content: htmlEditor.value },
                { name: 'styles.css', content: cssEditor.value },
                { name: 'script.js', content: jsEditor.value }
            ];

            files.forEach(file => {
                const blob = new Blob([file.content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // Reset to default
        function resetEditor() {
            htmlEditor.value = '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>My Page</title>\n  <link rel="stylesheet" href="styles.css">\n</head>\n<body>\n  <h1>Hello Terminal</h1>\n  <p>Start coding...</p>\n  <script src="script.js"><' + '/script>\n</body>\n</html>';

            cssEditor.value = 'body {\n  font-family: monospace;\n  background: #000;\n  color: #2596be;\n  padding: 20px;\n}\n\nh1 {\n  text-shadow: 0 0 10px #2596be;\n  color: #4db8e8;\n}';

            jsEditor.value = 'console.log(\'Terminal initialized...\');\n\n// Your code here';

            runCode();
        }

        // Event listeners
        runBtn.addEventListener('click', runCode);
        downloadBtn.addEventListener('click', downloadFiles);
        clearBtn.addEventListener('click', resetEditor);

        // Auto-run on load
        runCode();

        // Auto-update preview on typing
        let timeout;
        [htmlEditor, cssEditor, jsEditor].forEach(editor => {
            editor.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(runCode, 1000);
            });
        });
    </script>
</body>
</html>
