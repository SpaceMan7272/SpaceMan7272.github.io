<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #2596be;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #embedded-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Shortcut indicator - shows briefly when page loads */
        #shortcut-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #2596be;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 20px rgba(37, 150, 190, 0.5);
        }

        #shortcut-indicator.show {
            opacity: 1;
        }

        .shortcut-line {
            margin: 3px 0;
        }

        .shortcut-key {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #2596be;
        }
    </style>
</head>
<body>
    <!-- Change the src to your embedded page URL -->
    <iframe id="embedded-frame" src="https://photopea.com" allow="fullscreen; autoplay; encrypted-media"></iframe>

    <div id="shortcut-indicator">
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+Z</span> - Home Screen</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+X</span> - Others</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+C</span> - Education</div>
        <div class="shortcut-line">Press <span class="shortcut-key">ALT+V</span> - Web</div>
    </div>

    <script>
        // ===== EASY CONFIGURATION =====
        // Edit shortcuts here - format: { key: 'letter', alt: true/false, url: 'your-url' }
        const shortcuts = [
            { key: 'z', alt: true, url: '/index.html' },
            { key: 'x', alt: true, url: 'other/index.html' },
            { key: 'c', alt: true, url: 'class/index.html' },
            { key: 'v', alt: true, url: 'web/index.html' }
        ];
        // ===== END CONFIGURATION =====

        // Show shortcut indicator on page load
        const indicator = document.getElementById('shortcut-indicator');
        setTimeout(() => {
            indicator.classList.add('show');
        }, 500);

        // Hide after 5 seconds
        setTimeout(() => {
            indicator.classList.remove('show');
        }, 5500);

        // Handle keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            shortcuts.forEach(shortcut => {
                if (e.altKey === shortcut.alt && e.key.toLowerCase() === shortcut.key.toLowerCase()) {
                    e.preventDefault();
                    window.location.href = shortcut.url;
                }
            });
        });

        // Show indicator again when Alt is pressed
        document.addEventListener('keydown', (e) => {
            if (e.altKey && !indicator.classList.contains('show')) {
                indicator.classList.add('show');
                setTimeout(() => {
                    indicator.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
