    <style>
        :root {
            --bg: #0e0b07; --paper: #1a140c; --paper-ink: #e7dcc3; --ink: #f1e7cf;
            --muted: #c7b995; --border: #5a4a2a; --nav: #120e08; --shadow: rgba(0,0,0,0.45);
            --accent: #d4a356; --font-main: "Red Hat Display", sans-serif;
        }

        body.light-mode {
            --bg: #efe6cf; --paper: #fbf6e8; --paper-ink: #2b2416; --ink: #2b2416;
            --muted: #4a3f2a; --border: #cdbf9b; --nav: #f3ead3; --shadow: rgba(0,0,0,0.18);
            --accent: #a67c38;
        }

        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--ink); font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; transition: all 0.3s ease; }

        /* Sidebar */
        .sidebar { width: 320px; background-color: var(--nav); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; z-index: 10; }
        .header { padding: 20px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.2rem; font-weight: 800; margin: 0 0 15px 0; text-transform: uppercase; }
        .top-btns { display: flex; gap: 8px; }
        .btn { background: var(--paper); border: 1px solid var(--border); color: var(--ink); cursor: pointer; padding: 6px 10px; border-radius: 4px; font-family: var(--font-main); font-size: 0.8rem; transition: 0.2s; flex: 1; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.active { background: var(--accent); color: var(--bg); }

        .plane-list { flex: 1; overflow-y: auto; padding: 10px; }
        .era-group { margin-bottom: 20px; }
        .era-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 10px; border-bottom: 1px solid var(--border); margin-bottom: 5px; font-weight: 900; }
        .plane-item { padding: 10px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; margin-bottom: 2px; }
        .plane-item:hover { background: var(--paper); }
        .plane-item.selected { border: 1px solid var(--accent); background: rgba(212, 163, 86, 0.1); }
        .plane-item.active { background-color: var(--accent); color: var(--bg); }
        .compare-chk { pointer-events: none; }

        /* Main View */
        .main-stage { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .viewer-box { width: 100%; height: 55vh; display: flex; background: radial-gradient(circle at center, var(--paper) 0%, var(--bg) 100%); }
        model-viewer { flex: 1; height: 100%; }

        /* Stats Section */
        .stats-area { height: 45vh; background-color: var(--paper); border-top: 1px solid var(--border); padding: 25px; overflow-y: auto; box-shadow: 0 -10px 30px var(--shadow); }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .data-card { background: rgba(0,0,0,0.15); border: 1px solid var(--border); padding: 15px; border-radius: 6px; }
        .data-category { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 800; border-bottom: 1px solid var(--border); padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; line-height: 1.4; }
        .stat-key { color: var(--muted); }
        .stat-val { color: var(--paper-ink); font-weight: 600; text-align: right; }
        
        .compare-header { display: flex; justify-content: space-around; font-size: 1.5rem; font-weight: 900; margin-bottom: 20px; color: var(--accent); }
    </style>
</head>

        const eraLabels = {
            "old": "Old Era",
            "worldwar": "World War Era",
            "coldwar": "Cold War Era",
            "semimodern": "Semi-Modern Era",
            "modern": "Modern Era",
            "superhigh": "Super High Era"
        };

        const units = {
            mass: "kg", maxTakeoffMass: "kg", thrust: "N", afterburnerMultiplier: "x",
            wingArea: "m²", wingSpan: "m", maxSpeed: "Mach", cruiseSpeed: "Mach", 
            stallSpeed: "Mach", maxAltitude: "m", climbRate: "m/s", maxTurnRate: "°/s", 
            rollRate: "°/s", maxGLoad: "G", minGLoad: "G", fuelCapacity: "L", 
            fuelConsumption: "L/s", fuelConsumptionIdle: "L/s", radarCrossSection: "m²",
            ammoPerGun: "rounds", rateOfFire: "RPM", muzzleVelocity: "m/s", effectiveRange: "m",
            weight: "kg", yield: "kt", range: "m", speed: "m/s"
        };

        let currentMode = 'view';
        let selectedPlanes = [];

        function setMode(mode) {
            currentMode = mode;
            selectedPlanes = [];
            document.getElementById('viewModeBtn').classList.toggle('active', mode === 'view');
            document.getElementById('compareModeBtn').classList.toggle('active', mode === 'compare');
            document.getElementById('viewer2').style.display = mode === 'compare' ? 'block' : 'none';
            renderSidebar();
            document.getElementById('statsContent').innerHTML = `<p style="text-align:center; color:var(--muted)">Select ${mode === 'view' ? 'an aircraft' : 'two aircraft'} to begin.</p>`;
        }

        function renderSidebar() {
            const list = document.getElementById('planeList');
            list.innerHTML = '';
            Object.keys(eraLabels).forEach(eraKey => {
                const planes = aircraftData.filter(p => p.era === eraKey);
                if (planes.length === 0) return;

                const group = document.createElement('div');
                group.className = 'era-group';
                group.innerHTML = `<div class="era-title">${eraLabels[eraKey]}</div>`;
                
                planes.forEach(plane => {
                    const item = document.createElement('div');
                    item.className = 'plane-item';
                    item.innerHTML = `<span>${plane.name}</span> <span style="font-size:0.7rem; opacity:0.6">${plane.year}</span>`;
                    item.onclick = () => handleSelect(plane);
                    group.appendChild(item);
                });
                list.appendChild(group);
            });
        }

        function handleSelect(plane) {
            if (currentMode === 'view') {
                selectedPlanes = [plane];
                document.querySelectorAll('.plane-item').forEach(el => el.classList.remove('active'));
                event.currentTarget.classList.add('active');
                updateUI();
            } else {
                const idx = selectedPlanes.findIndex(p => p.id === plane.id);
                if (idx > -1) {
                    selectedPlanes.splice(idx, 1);
                    event.currentTarget.classList.remove('selected');
                } else if (selectedPlanes.length < 2) {
                    selectedPlanes.push(plane);
                    event.currentTarget.classList.add('selected');
                }
                if (selectedPlanes.length === 2) updateUI();
            }
        }

        function updateUI() {
            const v1 = document.getElementById('viewer1');
            const v2 = document.getElementById('viewer2');
            
            if (selectedPlanes[0]) v1.src = selectedPlanes[0].modelPath;
            if (selectedPlanes[1]) v2.src = selectedPlanes[1].modelPath;

            const content = document.getElementById('statsContent');
            if (currentMode === 'view') {
                content.innerHTML = renderPlaneStats(selectedPlanes[0]);
            } else if (selectedPlanes.length === 2) {
                content.innerHTML = `
                    <div class="compare-header">
                        <div>${selectedPlanes[0].name}</div>
                        <div style="color:var(--muted); font-size:1rem">VS</div>
                        <div>${selectedPlanes[1].name}</div>
                    </div>
                    <div class="compare-grid">
                        <div>${renderPlaneStats(selectedPlanes[0], true)}</div>
                        <div>${renderPlaneStats(selectedPlanes[1], true)}</div>
                    </div>
                `;
            }
        }

        function renderPlaneStats(p, isCompare = false) {
            const categories = [
                { t: "Physical", k: ["mass", "maxTakeoffMass"] },
                { t: "Performance", k: ["thrust", "afterburner", "afterburnerMultiplier"] },
                { t: "Aero", k: ["dragCoefficient", "liftCoefficient", "wingArea", "wingSpan"] },
                { t: "Envelope", k: ["maxSpeed", "cruiseSpeed", "stallSpeed", "maxAltitude", "climbRate"] },
                { t: "Maneuver", k: ["maxTurnRate", "rollRate", "maxGLoad", "minGLoad"] },
                { t: "Fuel", k: ["fuelCapacity", "fuelConsumption", "fuelConsumptionIdle"] },
                { t: "Survive", k: ["armor", "survivability", "radarCrossSection", "infraredSignature"] }
            ];
            let html = isCompare ? '' : `<h2 style="margin-top:0">${p.name} <small style="font-weight:300; color:var(--muted)">(${p.nation}, ${p.year})</small></h2>`;
            html += `<div class="${isCompare ? '' : 'data-grid'}">`;
            
            categories.forEach(cat => {
                let rows = '';
                cat.k.forEach(key => {
                    if (p[key] !== undefined) {
                        let val = p[key];
                        if (typeof val === 'boolean') val = val ? "YES" : "NO";
                        const unit = units[key] ? ` ${units[key]}` : '';
                        rows += `<div class="stat-row"><span class="stat-key">${key}</span><span class="stat-val">${val}${unit}</span></div>`;
                    }
                });
                if (rows) {
                    html += `<div class="data-card" style="${isCompare ? 'margin-bottom:15px' : ''}"><div class="data-category">${cat.t}</div>${rows}</div>`;
                }
            });

            // Weapons
            if (p.primaryGuns?.length > 0) {
                let gunRows = '';
                p.primaryGuns.forEach(g => {
                    gunRows += `<div class="stat-row"><span class="stat-key">${g.type}</span><span class="stat-val">${g.count}x ${g.caliber}</span></div>`;
                    ["ammoPerGun", "rateOfFire", "muzzleVelocity", "effectiveRange"].forEach(k => {
                        gunRows += `<div class="stat-row" style="font-size:0.75rem; padding-left:10px;"><span class="stat-key">${k}</span><span class="stat-val">${g[k]}${units[k]||''}</span></div>`;
                    });
                });
                html += `<div class="data-card"><div class="data-category">Weapons</div>${gunRows}</div>`;
            }

            html += `</div>`;
            return html;
        }

        init();
        function init() { setMode('view'); }
    </script>
